      operationId: getManifest
      description: |-
        Retrieves the manifest of the specified source design.

        The manifest is a JSON file containing information about all the derivatives translated from the specified source design, including the URNs of the derivatives, the translation status of each derivative, and other details.

        The first time you translate a source design, the Model Derivative service creates a manifest for that design. Thereafter, every time you translate that source design, even to a different format, the Model Derivative service updates the same manifest rather than creating a new one. The manifest acts as a central registry for all the derivatives of your source design created through the Model Derivative service.

        When the Model Derivative service starts a translation job (as a result of a request you make using `Create Translation Job </en/docs/model-derivative/v2/reference/http/jobs/job-POST/>`_), it updates the manifest at regular intervals. You can use the manifest to check the status and progress of each derivative being generated. When multiple derivatives have been requested, each may complete at a different time. Each derivative has its own ``status`` attribute. The manifest also contains an overall ``status`` attribute. The overall ``status`` becomes ``complete`` when the ``status`` of all individual derivatives become complete.

        Once the translation status of a derivative is ``complete``, you can download the derivative.

        **Note:** You cannot download 3D SVF2 derivatives.
      security:
        - 2-legged:
            - 'data:read'
            - 'viewable:read'
        - 3-legged:
            - 'data:read'
            - 'viewable:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6bW9kZWxkZXJpdmF0aXZlL0E1LnppcA/manifest" -X GET -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json"'
      parameters:
        - $ref: '#/components/parameters/accept-encoding'
        - $ref: '#/components/parameters/region'
    delete:
      summary: Delete Manifest
      tags:
        - Manifest
      responses:
        '200':
          description: The manifest was successfully deleted.
          headers:
            x-ads-app-identifier:
              $ref: '#/components/headers/x-ads-app-identifier'
            x-ads-startup-time:
              $ref: '#/components/headers/x-ads-startup-time'
            x-ads-duration:
              $ref: '#/components/headers/x-ads-duration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteManifest'
        '400':
          $ref: '#/components/responses/400-general'
        '401':
          $ref: '#/components/responses/401-general'
        '403':
          $ref: '#/components/responses/403-general'
        '404':
          $ref: '#/components/responses/404-general'
        '500':
          $ref: '#/components/responses/500-general'
      operationId: deleteManifest
      description: |
        Deletes the manifest of the specified source design. It also deletes all derivatives (translated output files) generated from the source design. However, it does not delete the source design.

        **Note:** This operation is idempotent. If you call it multiple times, even when no manifest exists, it will still return a successful response (200).
      security:
        - 2-legged:
            - 'data:write'
            - 'data:read'
        - 3-legged:
            - 'data:write'
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6bW9kZWxkZXJpdmF0aXZlL0E1LnppcA/manifest" -X DELETE -H "Authorization: Bearer eyJh..."'
      parameters:
        - $ref: '#/components/parameters/region'
  /modelderivative/v2/designdata/job:
    post:
      summary: Create Translation Job
      tags:
        - Jobs
      responses:
        '200':
          description: The translation job was successfully created and started.
          headers:
            x-ads-app-identifier:
              $ref: '#/components/headers/x-ads-app-identifier'
            x-ads-startup-time:
              $ref: '#/components/headers/x-ads-startup-time'
            x-ads-duration:
              $ref: '#/components/headers/x-ads-duration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '201':
          description: 'The requested derivative already exists, so a new derivative will not be generated.'
        '400':
          description: The server was unable to process the request. The syntax of the request is malformed or the request is missing a required header. Do not repeat the request without fixing the issue. The response body may indicate what is wrong with the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '401':
          $ref: '#/components/responses/401-general'
        '403':
          $ref: '#/components/responses/403-general'
        '404':
          $ref: '#/components/responses/404-general'
        '406':
          description: 'The request contains values that are not acceptable. For example, the output type you requested may not be supported. Please check your request parameters and modify them to contain only supported values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '409':
          $ref: '#/components/responses/409-general'
        '429':
          $ref: '#/components/responses/429-general'
        '500':
          $ref: '#/components/responses/500-general'
      operationId: startJob
      description: |-
        Creates a job to translate the specified source design to another format, generating derivatives of the source design. You can optionally:

        - Extract selected parts of a design and export the set of geometries in OBJ format.
        - Generate different-sized thumbnails.

        When the translation job runs, details about the process and generated derivatives are logged to a JSON file known as a manifest. This manifest is typically created during the first translation of a source design. Subsequently, the system updates the same manifest whenever a translation is performed for that design. 

        If necessary, you can set the ``x-ads-force`` header to ``true``. The system will then delete the existing manifest and create a new one. However, be aware that doing so will also delete all previously generated derivatives.
      security:
        - 2-legged:
            - 'data:read'
            - 'data:write'
            - 'data:create'
        - 3-legged:
            - 'data:read'
            - 'data:write'
            - 'data:create'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/job" -X POST -H "Content-Type: application/json" -H "Authorization: Bearer eyJh..." --data ''{"input":{"urn":"dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6anAtYnVja2V0LTI1MDUwMi9ib3guaXB0"},"output":{"destination":{"region":"EMEA"},"formats":[{"type":"svf2","views":["2d","3d"]}]}}'''
      parameters:
        - $ref: '#/components/parameters/x-ads-force-job'
        - $ref: '#/components/parameters/x-ads-derivative-format'
        - $ref: '#/components/parameters/region'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPayload'
    parameters: []
  '/modelderivative/v2/designdata/{urn}/references':
    post:
      summary: Specify References
      tags:
        - Jobs
      responses:
        '200':
          description: The locations of referenced files were successfully recorded.
          headers:
            x-ads-app-identifier:
              $ref: '#/components/headers/x-ads-app-identifier'
            x-ads-duration:
              $ref: '#/components/headers/x-ads-duration'
            x-ads-startup-time:
              $ref: '#/components/headers/x-ads-startup-time'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecifyReferences'
        '400':
          $ref: '#/components/responses/400-general'
        '401':
          $ref: '#/components/responses/401-general'
        '403':
          $ref: '#/components/responses/403-general'
        '404':
          $ref: '#/components/responses/404-general'
        '406':
          description: 'The request contains unacceptable references. For example, one or more referenced files may be stored in a different region than the source design. Please verify that all referenced resources are in the same region and adjust your request accordingly.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '500':
          $ref: '#/components/responses/500-general'
      operationId: specifyReferences
      description: |
        Specifies the location of the files referenced by the specified source design.

        When you call `Create Translation Job </en/docs/model-derivative/v2/reference/http/job-POST>`_, set  ``checkReferences`` to ``true``.   The Model Derivative service will then use the details you specify in this operation to locate and download the referenced files.
      security:
        - 2-legged:
            - 'data:read'
            - 'data:write'
            - 'data:create'
        - 3-legged:
            - 'data:read'
            - 'data:write'
            - 'data:create'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6anAtYnVja2V0LTI1MDUwMi9zY2lzc29ycy5pYW0=/references" -X POST -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json" --data ''{"urn":"urn:adsk.objects:os.object:jp-bucket-250502/scissors.iam","filename":"scissors.iam","references":[{"urn":"urn:adsk.objects:os.object:jp-bucket-250502/blade_main.ipt","relativePath":"Components/blade_main.ipt","filename":"blade_main.ipt"},{"urn":"urn:adsk.objects:os.object:jp-bucket-250502/blade_top.ipt","relativePath":"Components/blade_top.ipt","filename":"blade_top.ipt"},{"urn":"urn:adsk.objects:os.object:jp-bucket-250502/scissor_spring.ipt","relativePath":"Components/scissor_spring.ipt","filename":"scissor_spring.ipt"}]}'''
      parameters:
        - $ref: '#/components/parameters/region'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecifyReferencesPayload'
    parameters:
      - name: urn
        in: path
        required: true
        schema:
          type: string
        description: The Base64 (URL Safe) encoded design URN.

