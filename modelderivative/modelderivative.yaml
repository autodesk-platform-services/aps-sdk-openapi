      title: DWG
    JobPayloadFormatSVFAdvancedNWD:
      type: object
      description: Contains advanced configuration settings for translation jobs processing NWD inputs.
      properties:
        hiddenObjects:
          type: boolean
          description: |
            Specifies whether hidden objects must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract hidden objects from the input file.
            - ``false``: (Default) Do not extract hidden objects from the input file.
        basicMaterialProperties:
          type: boolean
          description: |
            Specifies whether basic material properties must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract properties for basic materials.
            - ``false``: (Default) Do not extract properties for basic materials.
        autodeskMaterialProperties:
          type: boolean
          description: |
            Specifies whether Autodesk material properties must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract properties for Autodesk materials.
            - ``false``: (Default) Do not extract properties for Autodesk materials.
        timelinerProperties:
          type: boolean
          description: |
            Specifies whether timeliner properties must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract timeliner properties.
            - ``false``: (Default) Do not extract timeliner properties.
      title: NWD
    JobPayloadFormatSVF2AdvancedNWD:
      type: object
      description: Contains advanced configuration settings for translation jobs processing NWD inputs.
      properties:
        hiddenObjects:
          type: boolean
          description: |
            Specifies whether hidden objects must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract hidden objects from the input file.
            - ``false``: (Default) Do not extract hidden objects from the input file.
        basicMaterialProperties:
          type: boolean
          description: |
            Specifies whether basic material properties must be extracted. Applicable only when the source design type is Navisworks.

            - ``true``: Extract properties for basic materials.
            - ``false``: (Default) Do not extract properties for basic materials.
        autodeskMaterialProperties:
          type: boolean
