openapi: 3.0.1
info:
  title: Model Derivative
  version: '2.0'
  description: Use the Model Derivative API to translate designs from one CAD format to another. You can also use this API to extract metadata from a model.
  termsOfService: 'https://www.autodesk.com/company/legal-notices-trademarks/terms-of-service-autodesk360-web-services/forge-platform-web-services-api-terms-of-service'
  x-support: 'https://stackoverflow.com/questions/tagged/autodesk-model-derivative'
  contact:
    name: Autodesk Platform Services
    url: 'https://aps.autodesk.com/'
    email: aps.help@autodesk.com
security:
  - 2-legged:
      - 'data:read'
      - 'data:write'
  - 3-legged:
      - 'data:read'
      - 'data:write'
servers:
  - url: 'https://developer.api.autodesk.com'
tags:
  - name: Informational
  - name: Jobs
  - name: Manifest
  - name: Derivatives
  - name: Thumbnails
  - name: Metadata
components:
  securitySchemes:
    3-legged:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://developer.api.autodesk.com/authentication/v2/authorize'
          tokenUrl: 'https://developer.api.autodesk.com/authentication/v2/token'
          refreshUrl: 'https://developer.api.autodesk.com/authentication/v2/token'
          scopes:
            'data:read': read your data
            'data:write': modify your data
            'data:create': create new data
      x-authentication_context: user context required
      description: User context required.
    2-legged:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: 'https://developer.api.autodesk.com/authentication/v2/token'
          scopes:
            'data:read': read application accessible data
            'data:write': write application accessible data
            'data:create': create application accessible data
      x-authentication_context: application context required
      description: Application context required.
  parameters:
    accept-encoding:
      name: Accept-Encoding
      in: header
      schema:
        type: string
      description: |
        A comma separated list of the algorithms you want the response to be encoded in, specified in the order of preference.  

        If you specify ``gzip`` or ``*``, content is compressed and returned in gzip format.
    x-ads-force:
      name: x-ads-force
      in: header
      required: false
      schema:
        type: boolean
      description: |
        - ``true`` - Forces the system to parse property data all over again. Use this option to retrieve an object tree when previous attempts have failed.
        - ``false`` - (Default) Use previously parsed property data to extract the object tree.
    x-ads-force-job:
      name: x-ads-force
      in: header
      required: false
      schema:
        type: boolean
      description: |
        Specifies how the translation job must handle any existing manifest and derivatives.

        - ``true`` - Deletes the existing manifest and derivatives of the source design before translation.
        - ``false`` - (Default) Updates existing manifest and generates derivatives only for the formats that the source design has no derivatives.
    x-ads-derivative-format:
      name: x-ads-derivative-format
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/XAdsDerivativeFormat'
      description: |
        Specifies which Object IDs to return if the design has legacy SVF derivatives generated by the BIM Docs or Forma Data Management service. Possible values:

        - ``latest`` - (Default) Return SVF2 Object IDs.
        - ``fallback`` - Return SVF Object IDs.

        **Note:**

        1. This header applies only to designs with legacy SVF derivatives generated by the BIM 360 Docs or Forma Data Management service.
        2. The BIM 360 Docs or Forma Data Management service now generates SVF2 derivatives. SVF2 Object IDs may not be compatible with the SVF Object IDs previously generated by the BIM 360 Docs or Forma Data Management service. Setting this header to fallback may resolve backward compatibility issues resulting from Object IDs of legacy SVF derivatives being retained on the client side.
        3. If you use this header with one derivative (URN), you must use it consistently across the following operations:

           - `Create Translation Job </en/docs/model-derivative/v2/reference/http/job-POST>`_ (for OBJ output) 
           - `Fetch Object Tree </en/docs/model-derivative/v2/reference/http/urn-metadata-modelguid-GET>`_
           - `Fetch All Properties </en/docs/model-derivative/v2/reference/http/urn-metadata-guid-properties-GET>`_
           - `Fetch Specific Properties <en/docs/model-derivative/v2/reference/http/metadata/urn-metadata-guid-properties-query-POST>`_
    forceget:
      name: forceget
      in: query
      required: false
      schema:
        type: string
      description: |
        - ``true`` - Retrieves large resources, even beyond the 20 MB limit. If exceptionally large (over 800 MB), the system acts as if ``forceget`` is ``false``.
        - ``false`` - (Default) Does not retrieve resources if they are larger than 20 MB.
    region:
      name: region
      in: header
      schema:
        $ref: '#/components/schemas/Region'
      description: |
        Specifies the data center where the manifest and derivatives of the specified source design are stored. Possible values are:

        - ``US`` - (Default) Data center for the US region.
        - ``EMEA`` - Data center for the European Union, Middle East, and Africa. 
        - ``AUS`` - Data center for the Australia region.
        - ``CAN`` - Data center for the Canada region.
        - ``DEU`` - Data center for the Germany region.
        - ``IND`` - Data center for the India region.
        - ``JPN`` - Data center for the Japan region.
        - ``GBR``  - Data center for the United Kingdom region.
    source-design-urn:
      name: urn
      in: path
      schema:
        type: string
      description: The URL-safe Base64 encoded URN of the source design. This value is used as the ``urn`` URI parameter in operations to access data for this source design.
      required: true
    width:
      name: width
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Width'
      description: |
        Width of thumbnail in pixels. Possible values:

        - ``100`` - 100 pixels wide.
        - ``200`` - 200 pixels wide.
        - ``400`` - 400 pixels wide.

        If ``width`` is omitted, but ``height`` is specified, ``width`` defaults to ``height``. If both ``width`` and ``height`` are omitted, the server will return a thumbnail closest to ``200``, if such a thumbnail is available.
    height:
      name: height
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Height'
      description: |
        Height of thumbnails in pixels. Possible values:

        - ``100`` - 100 pixels high.
        - ``200`` - 200 pixels high.
        - ``400`` - 400 pixels high.

        If ``height`` is omitted, but ``width`` is specified, ``height`` defaults to ``width``. If both ``width`` and ``height`` are omitted, the server will return a thumbnail closest to ``200``, if such a thumbnail is available.
  headers:
    x-ads-startup-time:
      description: 'The service startup time, in the following date format: ``EEE MMM dd HH:mm:ss Z yyyy``.'
      schema:
        type: string
    x-ads-app-identifier:
      description: 'The service identifier. Comprises of the service name, version, and environment.'
      schema:
        type: string
    x-ads-duration:
      description: 'The amount of time spent servicing the request, in milliseconds.'
      schema:
        type: string
    x-ads-troubleshooting:
      description: 'Provides information about server failures, if any.'
      schema:
        type: string
    x-ads-size:
      description: 'Size in bytes of the request data. Additionally, the system uses this information to determine if a 413 (content too large) response is returned.'
      schema:
        type: string
  responses:
    400-general:
      description: The server was unable to process the request. The syntax of the request is malformed or the request is missing a required header. Do not repeat the request without fixing the issue. The response body may indicate what is wrong with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    401-general:
      description: The supplied authorization header was not valid or the supplied token scope was not acceptable. Verify authentication and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    403-general:
      description: The request was successfully validated but lacking the required permissions. Verify your credentials and permissions before you send this request again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    404-general:
      description: The requested resource was not found. Review the request and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    406-general:
      description: 'The request contains values that are not acceptable. Please check your request parameters, especially the headers and modify them to include a supported media type, or contact the support team for a list of available content types.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    409-general:
      description: 'The request could not be completed due to a conflict with the current state of a resource. For example, you may be trying to create a resource that is currently being created by another request. Please review the response body for details and adjust your request accordingly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    429-general:
      description: The request was rejected because too many requests were sent within a specific time period. Wait before retrying the request. Check the response headers for rate limit information and recommended retry timing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
    500-general:
      description: 'An unexpected error occurred on the server, preventing it from completing your request. Please try again later. If the issue persists, contact the support team for assistance.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Diagnostic'
  schemas:
    Diagnostic:
      type: object
      title: Diagnostic
      description: Contains information about why the request failed.
      properties:
        diagnostics:
          type: string
          description: 'A detailed description of the error, which can help you troubleshoot the issue.'
    View:
      type: string
      description: Required options for SVF type. Possible values are ``2d`` and ``3d``.
      enum:
        - 2d
        - 3d
      title: ''
    Role:
      type: string
      minLength: 1
      enum:
        - 2d
        - 3d
      description: |-
        Specifies the type of a Model View.
        Possible values are: ``2d``, ``3d``.
    Payload:
      type: string
      description: |
        Specifies the format for numeric values in the response body. Possible values:

        - ``text`` - (Default) Returns all properties requested in ``fields`` without applying any special formatting.
        - ``unit`` - Applies a filter and returns only the properties that contain numerical values. Additionally, it formats property values as ``##<VALUE_OF_PROPERTY><UNIT_OF_VALUE><PRECISION><SYSTEM_UNIT>``. For example ``##94.172{mm}[3]{m}``, where ``94.172`` is the value of the property, ``{mm}`` is the unit of the value, ``[3]`` is the precision, and ``{m}`` is the metric base unit for the measurement.
      minLength: 1
      enum:
        - text
        - unit
    ConversionMethod:
      type: string
      enum:
        - legacy
        - modern
        - v3
        - v4
      description: |-
        Specifies what IFC loader to use during translation. Applicable only when the source design is of type IFC. Possible values are:

        - ``legacy`` - Use IFC loader version 1, which is based on the Navisworks IFC loader. 
        - ``modern`` - Use IFC loader version 2, which is based on the Revit IFC loader. 
        - ``v3`` - Use IFC loader version 3, which is based on the Revit IFC loader.
        - ``v4`` - **(Recommended)** Use IFC loader version 4, which is a native solution specifically designed for Autodesk Platform Services (APS). It does not depend on Navisworks or Revit. 
    BuildingStoreys:
      type: string
      description: |-
        Specifies how storeys are translated. Applicable only when the source design is of type IFC. Possible values are:

        - ``hide`` - (Default) Storeys are translated but not visible by default.
        - ``show`` - Storeys are translated and are visible by default.
        - ``skip`` - Storeys are not translated.

        **Note:** These options are applicable only when ``conversionMethod`` is set to ``modern`` or ``v3``.
      enum:
        - hide
        - show
        - skip
    Spaces:
      type: string
      description: |-
        Specifies how spaces are translated. Applicable only when the source design is of type IFC. Possible values are:

        - ``hide`` - (Default) spaces are translated but are not visible by default.
        - ``show`` - Spaces are translated and are visible by default.
        - ``skip`` - Spaces are not translated.

        **Note:** These options are applicable only when ``conversionMethod`` is set to ``modern`` or ``v3``.
      enum:
        - hide
        - show
        - skip
    OpeningElements:
      type: string
      description: |
        Specifies how openings are translated. Applicable only when the source design is of type IFC. Possible values are:

        - ``hide`` - (Default) Openings are translated but are not visible by default.
        - ``show`` - Openings are translated and are visible by default.
        - ``skip`` - Openings are not translated.

        **Note:** These options are applicable only when conversionMethod is set to ``modern`` or ``v3``.
      enum:
        - hide
        - show
        - skip
    ExtractorVersion:
      type: string
      description: |-
        Specifies what version of the Revit translator/extractor to use. Applicable only when the source design is of type RVT. Possible values are:

        - ``next`` - Makes the translation job use the newest available version of the translator/extractor. This option is meant to be used by beta testers who wish to test a pre-release version of the translator. If no pre-release version is available, the system uses the current official release version.
        - ``previous`` - Makes the translation job use the previous official release version of the translator/extractor. This option is meant to be used as a workaround in case of regressions caused by a new official release of the translator/extractor. If this attribute is not specified, the system uses the current official release version.
      enum:
        - next
        - previous
    MaterialMode:
      type: string
      description: |-
        Specifies the materials to apply to the generated SVF derivatives. Applicable only when the source design is of type RVT. Possible values are:

        - ``auto`` - (Default) Use the current setting of the default view of the input file.
        - ``basic`` - Use basic materials.
        - ``autodesk`` - Use Autodesk materials.
      enum:
        - auto
        - basic
        - autodesk
    Hierarchy:
      type: string
      description: |-
        Specifies how the hierarchy of items are determined. Applicable only when the source design is of type VUE.

        - ``Classic`` - (Default) Uses hardcoded rules to set the hierarchy of items.
        - ``SystemPath`` - Uses a linked XML or MDB2 properties file to set hierarchy of items. You can use this option to make the organization of items consistent with SmartPlant 3D.

        **Notes:**

        1. The functioning of the SystemPath depends on the default setting of the property SP3D_SystemPath or System Path.
        2. The pathing delimiter must be \.
        3. If you want to customize further, import the VUE file to Navisworks. After that, use POST job on the resulting Navisworks (nwc/nwd) file.
      enum:
        - Classic
        - SystemPath
    2dView:
      type: string
      description: |-
        The format that 2D views must be rendered to. Possible values are:

        - ``legacy`` - (Default) Render to a model derivative specific file format.
        - ``pdf`` - Render to the PDF file format. When the source design is of type Revit, applies only to Revit 2022 files and newer. If the source design is of type DWG, only properties with semantic values are extracted. 
      enum:
        - legacy
        - pdf
    Width:
      type: integer
      description: |
        Width of thumbnail in pixels. Possible values:

        - ``100`` - 100 pixels wide.
        - ``200`` - 200 pixels wide.
        - ``400`` - 400 pixels wide.

        If ``width`` is omitted, but ``height`` is specified, ``width`` defaults to ``height``. If both ``width`` and ``height`` are omitted, the server will return a thumbnail closest to ``200``, if such a thumbnail is available.
      enum:
        - 100
        - 200
        - 400
    Height:
      type: integer
      description: |
        Height of thumbnails in pixels. Possible values:

        - ``100`` - 100 pixels high.
        - ``200`` - 200 pixels high.
        - ``400`` - 400 pixels high.

        If ``height`` is omitted, but ``width`` is specified, ``height`` defaults to ``width``. If both ``width`` and ``height`` are omitted, the server will return a thumbnail closest to ``200``, if such a thumbnail is available.
      enum:
        - 100
        - 200
        - 400
    Format:
      type: string
      description: |
        Specifies the format of the file to create, when the specified output is STL.  Possible values are:

        - ``ascii`` - Create derivative as an ASCII STL file.
        - ``binary`` - (Default) Create derivative as a binary STL file.  
      default: binary
      enum:
        - binary
        - ascii
    ExportFileStructure:
      type: string
      description: |
        Specifies the structure of the derivative, when the specified output is STL. Possible values are: 

        - ``single`` (Default) Create one STL file for all the input files (assembly file).
        - ``multiple``: Create a separate STL file for each object
      default: single
      enum:
        - single
        - multiple
    ApplicationProtocol:
      type: string
      description: |
        Specifies the application protocol to use when the output type is STEP. Possible values are: 

        - ``203`` - Configuration controlled design.
        - ``214`` - (Default) Core data for automotive mechanical design processes. 
        - ``242`` - Managed model based 3D engineering. 
      default: '214'
      enum:
        - '203'
        - '214'
        - '242'
    SurfaceType:
      type: string
      description: |
        Specifies the surface type to export as, when the output is IGES. Possible values are 

        - ``bounded`` - (Default) Bounded surface
        - ``trimmed`` - Trimmed surface
        -  `wireframe`. Wireframe  surface.'
      default: bounded
      enum:
        - bounded
        - trimmed
        - wireframe
    SheetType:
      type: string
      description: |
        The sheet body type to export as, when the output is IGES.  Possible values are:

        - ``open``
        -  ``shell`` 
        - ``surface`` - (Default)
        - ``wireframe``
      default: surface
      enum:
        - open
        - surface
        - shell
        - wireframe
    SolidType:
      type: string
      description: |
        The solid body type to export as, when the output is IGES. Possible values are: 

        - ``solid`` - (Default)
        - ``surface``
        - ``wireframe``
      default: solid
      enum:
        - solid
        - surface
        - wireframe
    Unit:
      type: string
      description: |-
        The units the models must be translated to, when the output type is OBJ. For example, from millimeters (10, 123, 31) to centimeters (1.0, 12.3, 3.1). If the source unit or the unit you are translating to is not supported, the values remain unchanged.
        Possible values are: 

        - ``meter``
        - ``decimeter``
        - ``centimeter``
        - ``millimeter``
        - ``micrometer``
        - ``nanometer``
        - ``yard``
        - ``foot``
        - ``inch``
        - ``mil``
        - ``microinch``

        **Note:** Not supported when the source design is F3D.
      enum:
        - meter
        - decimeter
        - centimeter
        - millimeter
        - micrometer
        - nanometer
        - yard
        - foot
        - inch
        - mil
        - microinch
    XAdsRole:
      type: string
      enum:
        - rendered
        - extracted
      description: |-
        The source of the thumbnail:  Possible values are:

        - ``rendered`` - Generated pursuant to this API call 
        - ``extracted`` - Obtained from the original design file'
    XAdsJobStatus:
      type: string
      enum:
        - inprogress
        - success
        - failed
        - timedout
      description: 'The execution status of the translation job.  Possible values are: ``inprogress``, ``success``, ``failed``, ``timedout``'
    Region:
      type: string
      description: |
        Specifies where the referenced files are stored. Possible values:

        - ``US`` - Data center for the US region.
        - ``EMEA`` - Data center for the European Union, Middle East, and Africa.
        - ``AUS`` - Data center for the Australia region.
        - ``CAN`` - Data center for the Canada region.
        - ``DEU`` - Data center for the Germany region.
        - ``IND`` - Data center for the India region.
        - ``JPN`` - Data center for the Japan region.
        - ``GBR`` - Data center for the United Kingdom region.
      enum:
        - US
        - EMEA
        - AUS
        - CAN
        - DEU
        - IND
        - JPN
        - GBR
    SupportedFormats:
      description: Represents the successful response of a List Supported Formats operation.
      type: object
      properties:
        formats:
          type: object
          description: 'A dictionary object that contains a collection of key-value pairs, where each pair represents the target file format and the corresponding source file formats.'
          additionalProperties:
            type: array
            items:
              type: string
            description: |
              Key-value pairs. The key is the target file format. The value is an array of source design file formats that can be translated to the specified target file format.
      title: ''
    ObjectTree:
      description: Represents the successful response of a Fetch Object Tree operation.
      type: object
      properties:
        data:
          type: object
          description: Envelope that contains the returned data.
          required:
            - type
            - objects
          properties:
            type:
              type: string
              description: The type of data that is returned. Always ``objects``.
              minLength: 1
            objects:
              type: array
              description: Collection of "objects" that constitute the nodes of the object tree.
              uniqueItems: true
              minItems: 1
              items:
                type: object
                properties:
                  objectid:
                    type: number
                    description: A non-persistent ID that is assigned to an object at translation time.
                  name:
                    type: string
                    description: Name of the object.
                    minLength: 1
                  objects:
                    type: array
                    description: An optional array of objects of type ``object`` where each object represents a child of the current node on the object tree.
                    uniqueItems: true
                    minItems: 1
                    items:
                      type: object
                      required:
                        - objectid
                        - name
                required:
                  - objectid
                  - name
    ModelViews:
      type: object
      properties:
        data:
          type: object
          description: Container for the data returned by the List Model Views operation.
          properties:
            type:
              type: string
              minLength: 1
              description: The type of data that is returned.
            metadata:
              type: array
              uniqueItems: true
              minItems: 1
              description: 'An array of objects, where each object represents a Model View.'
              items:
                type: object
                description: An array of flat JSON objects representing metadata.
                properties:
                  name:
                    type: string
                    minLength: 1
                    description: Name of the Model View.
                  guid:
                    type: string
                    minLength: 1
                    description: Unique ID of the Model View.
                  role:
                    $ref: '#/components/schemas/Role'
                  isMasterView:
                    type: boolean
                    description: |-
                      - ``true`` - Model View is a Master View derived from a Revit source design.
                      - ``false`` - (Default) Model View is not a Master View.
      description: Represents the successful response of a List Model Views operation.
    PropertiesData:
      type: object
      description: Container for the data returned by the Fetch All Properties operation.
      properties:
        type:
          type: string
          minLength: 1
          description: The type of data that is returned. Always ``properties``.
        collection:
          type: array
          uniqueItems: true
          minItems: 1
          description: |-
            A non-hierarchical list of objects contained in 
            the specified Model View. Each object has a 
            ``properties`` attribute, which contains the 
            properties of that object.
          items:
            type: object
            properties:
              objectid:
                type: number
                description: |
                  Unique identifier of the object.

                  **Note:** The ``objectid`` is a non-persistent ID assigned to an object when a design file is translated to SVF or SVF2. So:

                  - The ``objectid`` of an object can change if the design is translated to SVF or SVF2 again.
                  - If you require a persistent ID to reference an object, use ``externalId``.
              name:
                type: string
                minLength: 1
                description: Name of the object.
              externalId:
                type: string
                minLength: 1
                description: 'A unique identifier of the object as defined in the source design. For example, ``UniqueID`` in Revit files.'
              properties:
                type: object
                additionalProperties: true
                description: 'A JSON object containing dictionary objects (key value pairs), where the key is the property name and the value is the value of the property.'
    Properties:
      description: Represents a successful response to a Fetch All Properties operation.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PropertiesData'
    SpecificPropertiesPage:
      description: Represents the successful response of a Fetch Specific Properties operation.
      type: object
      properties:
        pagination:
          type: object
          description: Container for the attributes that define how the response paginated.
          required:
            - limit
            - offset
            - totalResults
          properties:
            limit:
              type: number
              description: The maximum number of properties you requested for this page.
            offset:
              type: number
              description: The number of items skipped (because they were returned in previous pages) when returning this page.
            totalResults:
              type: number
              description: The total number of properties to be returned.
        data:
          $ref: '#/components/schemas/PropertiesData'
      required:
        - pagination
        - data
    SpecificPropertiesPayload:
      type: object
      description: Represents the request body of a Fetch Specific Properties operation.
      properties:
        pagination:
          type: object
          description: 'Specifies how to split the response into multiple pages, and return the response one page at a time.'
          required:
            - offset
            - limit
          properties:
            offset:
              type: number
              description: 'The number of properties to skip. Use this attribute with the ``limit`` attribute to split the properties into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any properties). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the properties returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``. This attribute is 0 by default. The minimum value is 0.'
            limit:
              type: number
              description: 'The maximum number of properties to return in a single page. Use this attribute with the ``offset`` attribute to split the properties into multiple pages. To fetch the first page, specify ``offset`` =0 (do not skip any properties). To fetch the second page, specify ``offset`` = value of ``limit`` you specified for the first page. So, the server skips the search results returned on the first page. In general, ``offset`` = ``previous_offset`` + ``previous_limit``. This attribute is 20 by default. The minimum value is 1 and the maximum is 1000.'
        query:
          description: |-
            Specifies what objects to query. 
            Contains the parameters to pass to the search service. 
            You can use one of the following forms: 
          oneOf:
            - $ref: '#/components/schemas/MatchId'
            - $ref: '#/components/schemas/BeginsWith'
            - $ref: '#/components/schemas/EqualsTo'
            - $ref: '#/components/schemas/Between'
            - $ref: '#/components/schemas/LessThan'
            - $ref: '#/components/schemas/GreaterThan'
            - $ref: '#/components/schemas/Contains'
        fields:
          type: array
          items:
            type: string
          description: |
            Specifies what properties of the objects to return. If you do not specify this attribute, the response returns all properties.

            Possible values are:

            - ``properties`` - Return all properties.
            - ``properties.something``- Return the property named ``something`` and all its children.
            - ``properties.some*`` - Return all properties with names that begin with ``some`` and all their children.
            - ``properties.category.*`` - Return the property named ``category`` and all its children.
            - ``properties.*.property`` - Return any property named ``property`` regardless of its parent.
        payload:
          $ref: '#/components/schemas/Payload'
      required:
        - pagination
        - query
        - fields
    Manifest:
      type: object
      properties:
        urn:
          type: string
          description: The URL-safe Base64 encoded URN of the source design.
        derivatives:
          type: array
          description: 'An array of objects, where each object represents a derivative of the source design.'
          items:
            $ref: '#/components/schemas/ManifestDerivative'
        hasThumbnail:
          type: string
          minLength: 1
          description: |
            - ``true``: There is a thumbnail for the source design.
            - ``false``: There is no thumbnail for the source design.
        progress:
          type: string
          minLength: 1
          description: 'Indicates the overall progress of all translation jobs, as a percentage. Once all requested derivatives are generated, the value changes to ``complete``.'
        type:
          type: string
          minLength: 1
          description: The type of data that is returned. Always ``manifest``.
        region:
          type: string
          minLength: 1
          description: |
            Specifies the data center where the manifest, derivatives, and references are stored. Possible values are: 

            - ``US`` - Data center for the US region.
            - ``EMEA`` - Data center for European Union, Middle East, and Africa. 
            - ``AUS`` - Data center for the Australia region.
            - ``CAN`` - Data center for the Canada region.
            - ``DEU`` - Data center for the Germany region.
            - ``IND`` - Data center for the India region.
            - ``JPN`` - Data center for the Japan region.
            - ``GBR``  - Data center for the United Kingdom region.
        version:
          type: string
          minLength: 1
          description: Indicates the version of the schema that the manifest is based on.
        status:
          type: string
          minLength: 1
          description: 'Overall status of all translation jobs for the source design. Possible values are: ``pending``, ``success``, ``inprogress``, ``failed``, ``timeout``.'
      description: Represents the successful response of a Fetch Manifest operation.
    JobPayload:
      type: object
      description: Represents the request body of a Create Translation Job operation.
      required:
        - input
        - output
      properties:
        input:
          type: object
          description: Describes the attributes of the source design.
          required:
            - urn
          properties:
            urn:
              type: string
              description: |
                The URL safe Base64 encoded URN of the source design. 

                **Note:** The URN is returned as the ``objectID`` once you complete uploading the source design to APS. This value must be converted to a `Base64 (URL Safe) encoded <http://www.freeformatter.com/base64-encoder.html>`_ string before you can specify it for this attribute.
            compressedUrn:
              type: boolean
              description: |
                - ``true`` - The source design is compressed as a zip file. If set to ``true``, you need to define the ``rootFilename`` attribute.
                - ``false`` - (Default) The source design is not compressed.
              default: false
            rootFilename:
              type: string
              description: The file name of the top-level component of the source design.  Mandatory if  ``compressedUrn`` is set to ``true``.
            checkReferences:
              type: boolean
              description: |-
                - ``true`` - Instructs the system to check for references and, if any exist, download all referenced files. Setting this attribute to ``true`` is mandatory when translating source designs consisting of multiple files, such as Autodesk Inventor assemblies.
                - ``false`` - (Default) Instructs the system not to check for references.
        output:
          type: object
          description: Describes the attributes of the requested derivatives.
          required:
            - formats
          properties:
            destination:
              type: object
              description: |-
                (Deprecated) Specifies where to store generated derivatives.

                **Note:** Please use the ``region`` header instead of this attribute.
              deprecated: true
              properties:
                region:
                  type: string
                  description: |
                    Specifies where to store generated derivatives. Possible values are:

                    - ``US`` - (Default) Store derivatives at a data center for the United States of America.
                    - ``EMEA`` - Store derivatives at a data center for the European Union. 
                    - ``AUS`` - Store derivatives at a data center for the Australia region.
                    - ``CAN`` - Data center for the Canada region.
                    - ``DEU`` - Data center for the Germany region.
                    - ``IND`` - Data center for the India region.
                    - ``JPN`` - Data center for the Japan region.
                    - ``GBR``  - Data center for the United Kingdom region.

                    **Note**: 

                    - Please use the ``region`` header instead of this attribute.
                  deprecated: true
            formats:
              type: array
              description: 'An array of objects, where each object represents a requested derivative format. You can request multiple derivatives.'
              items:
                $ref: '#/components/schemas/JobPayloadFormat'
        misc:
          type: object
          description: Contains webhook configuration settings for notifying external systems about translation job events.
          properties:
            workflow:
              type: string
              description: 'The workflow ID of the webhook that listens to Model Derivative events. It must be 36 characters or less and can only contain alphanumeric characters (A-Z, 0-9) and hyphens (-).'
            workflowAttribute:
              type: object
              description: 'A user-defined JSON object, which you can use to set some custom workflow information. It must be less than 1KB and is ignored if ``misc.workflow`` is not specified.'
    JobPayloadFormat:
      description: Contains the configuration settings for each output type a translation job must produce. The available options depend on the output type.
      anyOf:
        - $ref: '#/components/schemas/JobPayloadFormatSVF'
        - $ref: '#/components/schemas/JobPayloadFormatSVF2'
        - $ref: '#/components/schemas/JobPayloadFormatThumbnail'
        - $ref: '#/components/schemas/JobPayloadFormatSTL'
        - $ref: '#/components/schemas/JobPayloadFormatSTEP'
        - $ref: '#/components/schemas/JobPayloadFormatIGES'
        - $ref: '#/components/schemas/JobPayloadFormatOBJ'
        - $ref: '#/components/schemas/JobPayloadFormatDWG'
        - $ref: '#/components/schemas/JobPayloadFormatIFC'
