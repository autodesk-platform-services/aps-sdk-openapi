          default: 0.001
        surfaceType:
          $ref: '#/components/schemas/SurfaceType'
        sheetType:
          $ref: '#/components/schemas/SheetType'
        solidType:
          $ref: '#/components/schemas/SolidType'
      description: Contains advanced configuration settings for translation jobs producing IGES outputs.
    JobPayloadFormatAdvancedOBJ:
      title: OBJ
      type: object
      properties:
        type:
          type: string
          description: The requested output type. ``obj`` in this case.
        advanced:
          type: object
          description: Contains advanced configuration settings for translation jobs producing `obj` outputs.
          properties:
            exportFileStructure:
              $ref: '#/components/schemas/ExportFileStructure'
            unit:
              $ref: '#/components/schemas/Unit'
            modelGuid:
              type: string
              description: Required for geometry extractions. Specifies the ID of the Model View that contains the geometry to extract.
            objectIds:
              type: array
              description: |
                Required for geometry extractions. Specifies the IDs of the objects (``objectID) to extract. -1 will extract the entire model.
              items:
                type: integer
      description: Contains advanced configuration settings for translation jobs producing `obj` outputs.
    JobPayloadFormatAdvancedSTEP:
      title: STEP
      type: object
      properties:
        applicationProtocol:
          $ref: '#/components/schemas/ApplicationProtocol'
        tolerance:
          type: number
          description: Possible values are between `0` and `1`. By default it is set at 0.001.
          format: float
          default: 0.001
      description: Contains advanced configuration settings for translation jobs producing a STEP output.
    JobPayloadFormatAdvancedSTL:
      title: STL
      type: object
      properties:
        type:
          type: string
          description: The requested output type. ``stl`` in this case.
        advanced:
          type: object
          description: Contains advanced configuration settings for translation jobs producing `stl` outputs.
          properties:
            format:
              $ref: '#/components/schemas/Format'
            exportColor:
              type: boolean
              description: |
                - ``true`` - (Default) Exports color.
                - ``false`` - Does not export color.
              default: true
            exportFileStructure:
              $ref: '#/components/schemas/ExportFileStructure'
      description: Contains advanced configuration settings for translation jobs producing `stl` outputs.
    JobPayloadFormatAdvancedThumbnail:
      title: Thumbnail
      type: object
      properties:
        width:
          $ref: '#/components/schemas/Width'
        height:
          $ref: '#/components/schemas/Height'
      description: Contains advanced configuration settings for translation jobs producing thumbnail outputs.
    MatchId:
      title: Match Id
      type: object
      description: Describes a query for retrieving objects having the specified Object IDs or External IDs.
      properties:
        $in:
          type: array
          description: |
            Returns only the objects with their ``objectid`` or ``externalId`` attribute exactly matching one of the values specified in the array.

            The first element of the array contains the name of the attribute to match (``objectid`` or ``externalId``). Subsequent elements contain the values to match.

            For example, if you specify an array as: ``"$in":["objectid",1,2]``, the request will only return the properties of the objects with ``objectid`` = ``1`` and ``2``. If you specify an array as ``"$in":["externalId","doc_982afc8a","doc_afd75233" ]`` the request will only return the properties of the objects with ``externalId`` = ``doc_982afc8a`` and ``doc_afd75233``.
          items:
            oneOf:
              - type: string
              - type: number
      required:
        - '$in'
      additionalProperties: false
    BeginsWith:
      title: Begins With
      type: object
      description: Describes a query for retrieving objects with names that start with a specified string.
      properties:
        $prefix:
          type: array
          description: |
            Returns only the objects with their ``name`` attribute beginning with the specified string.

            The first element of the array contains the name of the attribute to match (``name``). The second element contains the string to match. The array can have only two elements. Only the objects whose name begin with the specified string are returned.
          items:
            type: string
      required:
        - '$prefix'
      additionalProperties: false
    EqualsTo:
      title: Equals To
      type: object
      description: Describes a query for retrieving objects where a specified attribute exactly matches a specified value.
      properties:
        $eq:
          type: array
          description: |-
            Returns only the objects where the value of the specified attribute (``name`` attribute or any numerical property) is exactly equal to the specified value.

            The first element of the array contains the name of the attribute. This can be the ``name`` attribute or the name of a numerical property. The second element of the array must be the value to match. If the first element is ``name``, must be a string value. If the first element is a numerical property, must be a numeric. The array can only be two elements long.

            For example, if you specify an array as: ``"$eq":["name","Rectangular"]``, the request will only return the properties of the object named ``Rectangular``. if you specify an array as: ``"$eq":["properties.Dimensions.Width1",0.6]``, the request will return the properties of all objects whose ``properties.Dimensions.Width1`` property is exactly equal to ``0.6``.

            **Note:** We recommend that you  use ``$between``  instead of ``$eq`` when testing non-integer numeric values for equality. Using ``between`` mitigates floating-point errors.
          items:
            oneOf:
              - type: string
              - type: number
      required:
        - '$eq'
      additionalProperties: false
    Between:
      title: Between
      type: object
      description: Describes a query for retrieving objects where a specified numeric property falls within a specified range.
      properties:
        $between:
          type: array
          description: |-
            Returns only the objects where the value of the specified numeric property lies between the specified values.

            The first element of the array contains the name of the property. The next two elements specify the values that the property must lie between. The array can only be three elements long.

            For example, if you specify an array as: ``"$between":["properties.Dimensions.Width1",1,10]``, the request returns the properties of all objects whose ``properties.Dimensions.Width1`` property is between ``1`` and ``10``.

            **Note:** The Model Derivative service converts numeric values from their native units to metric base units for comparison. So, you must specify the values to compare with in metric base units. For example, if the property you are comparing is a length measurement, you must specify the values  in ``m``.  Not in ``cm``, ``mm``, or ``ft``.
          items:
            oneOf:
              - type: string
              - type: number
      required:
        - '$between'
      additionalProperties: false
    LessThan:
      title: Less Than
      type: object
      description: Describes a query for retrieving objects where a specified numeric property is less than or equal to a specified value.
      properties:
        $le:
          type: array
          description: |-
            Returns only the objects where the value of the specified numeric property is less than or equal to the specified value.

            The first element of the array contains the name of the property. The next element specifies the values that the property must be less than or equal to. The array can only be two elements long.

            For example, if you specify an array as: ``"$le":["properties.Dimensions.Width1",10]``, the request returns the properties of all objects whose ``properties.Dimensions.Width1`` property is less than or equal to ``10``.

            **Note:** The Model Derivative service converts numeric values from their native units to metric base units for comparison. So, the value to compare with must be specified in metric base units. For example, if the property you are comparing is a length measurement, you must specify the value  in ``m``.  Not in ``cm``, ``mm``, or ``ft``.
          items:
            oneOf:
              - type: string
              - type: number
      required:
        - '$le'
      additionalProperties: false
    GreaterThan:
      title: Greater Than
      type: object
      description: 'Use this to retrieve only the properties of objects where a specified property is greater than a specified value. '
      properties:
        $ge:
          type: array
          description: |
            Returns only the objects where the value of the specified numerical property is greater than or equal to the specified value.

            The first element of the array contains the name of the property. The next element specifies the values that the property must be greater than or equal to. The array can only be two elements long.

            For example, if you specify an array as: ``"$ge":["properties.Dimensions.Width1",0.1]``, the request returns the properties of all objects whose ``properties.Dimensions.Width1`` property is greater than or equal to  ``0.1``.

            **Note:** The Model Derivative service converts numeric values from their native units to metric base units for comparison. So, the value to compare with must be specified in metric base units. For example, if the property you are comparing is a length measurement, you must specify the value  in ``m``.  Not in ``cm``, ``mm``, or ``ft``.
          items:
            oneOf:
              - type: string
              - type: number
      required:
        - '$ge'
      additionalProperties: false
    Contains:
      title: Contains
      type: object
      description: Describes a query for retrieving objects where a specified property contains one or more words in a specified string.
      properties:
        $contains:
          type: array
          description: |-
            Returns only the objects where the value of the specified property contains the words specified in a string.

            The first element of the array contains the name of the property. The second element contains a string containing the words to match. The array can only be two elements long.

            For example, if you specify an array as: ``"$contains":["properties.Materials and Finishes.Structural Material","Concrete Situ"]``, the request returns the properties of all objects whose ``properties.Materials and Finishes.Structural Material`` property contains the words  ``Concrete`` and ``Situ``. You can specify up to 50 words.
          items:
            type: string
      required:
        - '$contains'
      additionalProperties: false
    DeleteManifest:
      title: DeleteManifest
      type: object
      properties:
        result:
          type: string
          description: A message describing outcome of the operation. Always ``success`` for status ``200``.
      description: 'Represents the successful response of a Delete Manifest operation. '
    SpecifyReferencesPayload:
      title: SpecifyReferencesPayload
      type: object
      properties:
        urn:
          type: string
          description: The URL safe Base64 encoded URN of the source design. Mandatory if the Base64 encoded urn in the request URL is a logical URN.
        region:
          $ref: '#/components/schemas/Region'
        filename:
          type: string
          minLength: 1
          description: 'The file name of the top level component. By default, it is set to ``""`` and the file will be download with its ``urn``.'
        references:
          type: array
          uniqueItems: true
          minItems: 1
          description: 'An array of objects, where each object represents a referenced file.'
          items:
            type: object
            properties:
              urn:
                type: string
                minLength: 1
                description: The URN of the referenced file.
              relativePath:
                type: string
                minLength: 1
                description: 'The path to the referenced file, relative to the top level component. By default, it is set to ``""``, which means that the referenced file and top level component are in the same folder.'
              filename:
                type: string
                minLength: 1
                description: 'The file name of the referenced file. By default, it is set to ``""`` and the referenced file will be downloaded by its ``urn`` and placed relative to the top-level component using ``relativePath``.'
              metadata:
                type: object
                additionalProperties:
                  type: object
                description: An object to hold custom metadata.
            required:
              - urn
              - relativePath
              - filename
      required:
        - urn
        - filename
        - references
      description: Represents the request body of a Specify References operation.
    SpecifyReferences:
      title: SpecifyReferences
      type: object
      properties:
        result:
          type: string
          description: The result of the operation. Always ``success`` for status ``200``.
        urn:
          type: string
          description: The URN of the top level component.
      description: 'Represents the successful response of a Specify References operation. '
    OutputType:
      title: OutputType
      type: string
      description: 'The requested output types. Possible values include `svf`, `svf2`, `thumbnail`, `stl`, `step`, `iges`, `obj`, `ifc` or `dwg`. For a list of supported types, call [List Supported Formats](/en/docs/model-derivative/v2/reference/http/formats-GET).'
      enum:
        - svf
        - svf2
        - thumbnail
        - stl
        - step
        - iges
        - obj
        - ifc
        - dwg
        - fbx
    MatchIdType:
      title: MatchIdType
      type: string
      description: |-
        The first element of the array contains the name of the attribute to match (`objectid` or `externalId`). Subsequent elements contain the values to match.

        For example, if you specify an array as: `"$in":["objectid",1,2]`, the request will only return the properties of the objects with `objectid` = `1` and `2`. If you specify an array as `"$in":["externalId","doc_982afc8a","doc_afd75233" ]` the request will only return the properties of the objects with `externalId` = `doc_982afc8a` and `doc_afd75233`.
            
      enum:
        - objectid
        - externalId
