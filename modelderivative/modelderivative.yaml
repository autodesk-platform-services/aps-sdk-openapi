      operationId: getFormats
      description: |-
        Retrieves an up-to-date list of supported translations, including information on the types of derivatives that can be generated for each source design file type. You can also obtain a list of translations that have changed since a specified date.

        See the [Supported Translation Formats table](/en/docs/model-derivative/v2/overview/supported-translations/) for more details.

        **Note:** New file formats are continuously added to the supported translations list.
      parameters:
        - schema:
            type: string
          in: header
          name: If-Modified-Since
          description: 'Specifies a date in the ``Day of the week, DD Month YYYY HH:MM:SS GMT`` format. The response will contain only the formats modified since the specified date and time. If you specify an invalid date, the response will contain all supported formats. If no changes have been made after the specified date, the service returns HTTP status ``304``, NOT MODIFIED.'
        - $ref: '#/components/parameters/accept-encoding'
      security:
        - 2-legged: []
        - 3-legged: []
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/formats" -X GET -H "Authorization: Bearer eyJh..."'
    parameters: []
  '/modelderivative/v2/designdata/{urn}/metadata':
    parameters:
      - $ref: '#/components/parameters/source-design-urn'
    get:
      summary: List Model Views
      tags:
        - Metadata
      responses:
        '200':
          description: A list of Model Views was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelViews'
              examples:
                model-views:
                  summary: This example demonstrates the successful retrieval of a list of model views and their IDs (200).
                  value:
                    data:
                      type: metadata
                      metadata:
                        - name: NAVISWORKS/IFC EXPORT
                          role: 3d
                          guid: 04b9a71d-9015-0a7b-338b-8522a705a8d7
                        - name: New Construction
                          role: 3d
                          guid: 1d6e48c5-e4a4-8ca5-5b02-3f2acc354470
                          isMasterView: true
                        - name: 001 - 4128-AA-DC-681100**_IS01
                          role: 2d
