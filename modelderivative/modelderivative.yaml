    DerivativeDownload:
      title: DerivativeDownload
      type: object
      description: Represents the successful response of a Fetch Derivative Download operation.
      properties:
        etag:
          type: string
          description: 'The calculated ETag hash of the derivative/file, if available.'
        size:
          type: number
