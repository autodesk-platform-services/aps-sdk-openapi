      operationId: getModelViews
      description: |-
        Retrieves a list of Model Views (Viewables) in the source design specified by the ``urn`` URI parameter. The response also returns an ID that uniquely identifies each Model View. You can use these IDs with other metadata operations to obtain information about the objects within those Model Views.

        Designs created with applications like Fusion 360 and Inventor contain only one Model View per design. Applications like Revit allow multiple Model Views per design.

        **Note:** You can retrieve metadata only from a design that has already been translated to SVF or SVF2.
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6bW9kZWxkZXJpdmF0aXZlL0E1LnppcA/metadata" -X GET -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json"'
      parameters:
        - $ref: '#/components/parameters/accept-encoding'
        - $ref: '#/components/parameters/region'
  '/modelderivative/v2/designdata/{urn}/metadata/{modelGuid}':
    parameters:
      - $ref: '#/components/parameters/source-design-urn'
      - name: modelGuid
        in: path
        required: true
        schema:
          type: string
        description: The ID of the Model View you are extracting the object tree from. Use the `List Model Views </en/docs/model-derivative/v2/reference/http/metadata/urn-metadata-GET>`_ operation to obtain the IDs of the Model Views in the source design.
    get:
      summary: Fetch Object tree
      tags:
        - Metadata
      operationId: getObjectTree
      description: |
        Retrieves the structured hierarchy of objects, known as an object tree, from the specified Model View (Viewable) within the specified source design. The object tree represents the arrangement and relationships of various objects present in that Model View.

        **Note:** A design file must be translated to SVF or SVF2 before you can retrieve its object tree.  

        Before you call this operation:

        - Use the `List Model Views </en/docs/model-derivative/v2/reference/http/metadata/urn-metadata-GET/>`_ operation to obtain the list of Model Views in the source design.
        - Pick the ID of the Model View you want to query and specify that ID as the value for the ``modelGuid`` URI parameter.
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6bW9kZWxkZXJpdmF0aXZlL0E1LnppcA/metadata/6bfb4886-f2ee-9ccb-8db0-c5c170220c40" -X GET -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json"'
      parameters:
        - $ref: '#/components/parameters/accept-encoding'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/x-ads-force'
        - $ref: '#/components/parameters/x-ads-derivative-format'
        - $ref: '#/components/parameters/forceget'
        - schema:
            type: integer
          in: query
          name: objectid
          description: 'If specified, retrieves the sub-tree that has the specified Object ID as its parent node. If this parameter is not specified, retrieves the entire object tree.'
        - schema:
            type: string
          in: query
          name: level
          description: 'Specifies how many child levels of the hierarchy to return, when the ``objectid``  parameter is specified. Currently supports only ``level`` = ``1``.'
