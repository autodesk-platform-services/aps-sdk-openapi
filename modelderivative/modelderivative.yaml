        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/x-ads-derivative-format'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecificPropertiesPayload'
            examples:
