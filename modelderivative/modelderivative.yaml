      operationId: getAllProperties
      description: |-
        Retrieves a list of properties of all objects in the Model View specified by the ``modelGuid`` URI parameter.

        This operation returns properties of all objects by default. However, you can restrict the results to a specific object by specifying its ID as the ``objectid`` query parameter.

        Properties are returned as a flat list, ordered by their ``objectid``. The ``objectid`` is a non-persistent ID assigned to an object when the source design is translated to the SVF or SVF2 format. This means that:

        - A design file must be translated to SVF or SVF2 before you can retrieve properties.
        - The ``objectid`` of an object can change if the design is translated to SVF or SVF2 again. If you require a persistent ID across translations, use ``externalId`` to reference objects instead of ``objectid``.

        Before you call this operation:

        - Use the `List Model Views </en/docs/model-derivative/v2/reference/http/metadata/urn-metadata-GET/>`_ operation to obtain the list of Model Views (Viewables) in the source design.
        - Pick the ID of the Model View you want to query and specify that ID as the value for the ``modelGuid`` URI parameter.

        **Tip:** Use `Fetch Specific Properties </en/docs/model-derivative/v2/reference/http/metadata/urn-metadata-guid-properties-query-POST/>`_ to retrieve only the objects and properties of interest. The response is paginated, so when the number of properties returned is large, responses start arriving more promptly.
      security:
        - 2-legged:
            - 'data:read'
        - 3-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/modelderivative/v2/designdata/dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6bW9kZWxkZXJpdmF0aXZlL0E1LnppcA/metadata/4f981e94-8241-4eaf-b08b-cd337c6b8b1f/properties" -X GET -H "Authorization: Bearer eyJh......"'
