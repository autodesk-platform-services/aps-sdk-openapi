    Scopes:
      type: string
      title: ScopeEnum
      enum:
        - workflow
        - folder
        - project
      description: ''
    Region:
      type: string
      enum:
        - US
        - EMEA
        - AUS
        - CAN
        - DEU
        - IND
        - JPN
        - GBR
      description: |
        Specifies the geographical location (region) of the server the request must be executed on. This also corresponds to the region where Webhook data is stored. It is also the location of the server that will make requests to your callback URL. Possible values:

        - ``US`` - (Default) Data center dedicated to serve the United States region.
        - ``EMEA`` - Data center dedicated to serve the European Union, Middle East, and Africa regions.
        - ``AUS`` - Data center dedicated to serve the Australia region.
        - ``CAN`` - Data center dedicated to serve the Canada region.
        - ``DEU`` - Data center dedicated to serve the Germany region.
        - ``IND`` - Data center dedicated to serve the India region.
        - ``JPN`` - Data center dedicated to serve the Japan region.
        - ``GBR`` - Data center dedicated to serve the United Kingdom region.

        **Note:** You can specify the region using three methods: the ``region`` header, the ``x-ads-region`` header, and the ``region`` query parameter. The ``region`` header takes precedence over the ``x-ads-region`` header, and the ``x-ads-region`` header takes precedence over the ``region`` query parameter.
    XAdsRegion:
      type: string
      enum:
        - US
        - EMEA
        - AUS
        - CAN
        - DEU
        - IND
        - JPN
        - GBR
      description: |
        Specifies the geographical location (region) of the server the request must be executed on. This also corresponds to the region where Webhook data is stored. It is also the location of the server that will make requests to your callback URL. Possible values:

        - ``US`` - (Default) Data center dedicated to serve the United States region.
        - ``EMEA`` - Data center dedicated to serve the European Union, Middle East, and Africa regions.
        - ``AUS`` - Data center dedicated to serve the Australia region.
        - ``CAN`` - Data center dedicated to serve the Canada region.
        - ``DEU`` - Data center dedicated to serve the Germany region.
        - ``IND`` - Data center dedicated to serve the India region.
        - ``JPN`` - Data center dedicated to serve the Japan region.
        - ``GBR`` - Data center dedicated to serve the United Kingdom region.

        **Note:** You can specify the region using three methods: the ``region`` header, the ``x-ads-region`` header, and the ``region`` query parameter. The ``region`` header takes precedence over the ``x-ads-region`` header, and the ``x-ads-region`` header takes precedence over the ``region`` query parameter.
    Status:
      type: string
      enum:
        - active
        - inactive
        - reactivated
      description: |
        Indicates the current state of the webhook. Possible values are

        - ``active`` - Successfully delivered most recent event notifications.
        - ``inactive`` - Failed to deliver most recent event notification and has been deactivated.
        - ``reactivated`` - Previously inactive webhook that has been reactivated. No events have occurred since reactivation.

        See [Event Delivery Guarantees](/en/docs/webhooks/v1/developers_guide/event-delivery-guarantees/) for more information on how the system deactivates webhooks and subsequently reactivates them.
    StatusFilter:
      type: string
      enum:
        - active
        - inactive
        - reactivated
      description: |
        Filters retrieved webhooks by their current state. Possible values are

        - ``active`` - Successfully delivered most recent event notifications.
        - ``inactive`` - Failed to deliver most recent event notification and has been deactivated.
        - ``reactivated`` - Previously inactive but was reactivated. No events have occurred since reactivation.

        If this parameter is not specified, the filter is not applied. See [Event Delivery Guarantees](/en/docs/webhooks/v1/developers_guide/event-delivery-guarantees/) for more information on how the state of a webhook changes.
    Sort:
      type: string
      description: |
        Specifies the sorting order of the list of webhooks by their ``lastUpdatedDate`` attribute.

        - ``asc`` - Ascending order.
        - ``desc`` - (Default) Descending order.
      enum:
        - asc
        - desc
    StatusUpdate:
      type: string
      description: |
        Sets the current state of the webhook. Possible values:

        - ``active`` - Activates webhook.
        - ``inactive`` - Deactivates webhook.
      enum:
        - active
        - inactive
