  '/construction/forms/v1/projects/{projectId}/form-templates/{templateId}/forms/{formId}':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/FormId'
    patch:
      tags:
        - Forms
      summary: Update Form
      operationId: patchForm
      description: |-
        Updates a form's form details. Note that we do not currently support updating PDF forms.

        To edit a form, it must be in draft or inReview status and the user must have permissions to edit the form. See the Forms help documentation for information about template configurations.

        See the Manage Forms tutorial for details about updating form details.

        To update the form's main form fields (tabular and non-tabular) use PUT values:batch-upsert API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormPatchPayload'
            examples:
              example-1:
                value:
                  assigneeId: USER123A
                  assigneeType: user
                  name: Daily Safety Inspection
                  description: For Sam Subcontractor
                  formDate: '2020-11-20'
                  locationId: cee45678-fcc4-43ae-80a2-8ca819dfa70d
