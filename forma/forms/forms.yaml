openapi: 3.0.0
info:
  title: Construction.Forms
  version: '1.0'
  contact:
    name: Autodesk Plaform Services
    url: 'https://aps.autodesk.com/'
    email: aps.help@autodesk.com
  termsOfService: 'https://www.autodesk.com/company/legal-notices-trademarks/terms-of-service-autodesk360-web-services/forge-platform-web-services-api-terms-of-service'
  x-support: 'https://stackoverflow.com/questions/tagged/autodesk-platform-services'
  description: |
    The Autodesk Construction Cloud (ACC) Forms API (Forma) lets you retrieve form
    templates and layouts, create and update forms, read and batch-update form field
    values (including tabular values), and retrieve weather data captured on forms
    for a project.
servers:
  - url: 'https://developer.api.autodesk.com'
tags:
  - name: Templates
    description: Retrieve form templates and their layouts and sections.
  - name: Forms
    description: Create, retrieve, and update forms and their field values.
  - name: Weather
    description: Retrieve weather data associated with a form.
paths:
  '/construction/forms/v1/projects/{projectId}/form-templates':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Templates
      summary: Get Form Templates
      operationId: getFormTemplates
      description: Returns all project's form templates the user has access to.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LimitMax50'
        - name: updatedAfter
          in: query
          required: false
          description: Return Templates updated after specified time.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Return Templates updated before specified time.
          schema:
            type: string
            format: date-time
        - name: sortOrder
          in: query
          required: false
          description: 'Return Templates in specified sorted order. Possible values: desc, asc'
          schema:
            type: string
            enum:
              - desc
              - asc
      responses:
        '200':
          description: Form Templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplatesPage'
              examples:
                example-1:
                  value:
                    data:
                      - projectId: 9ba6681e-1952-4d54-aac4-9de6d9858dd4
                        id: 2f634a22-779d-4930-9f08-8391a41fea05
                        name: Daily Report
                        status: active
                        templateType: pg.template_type.daily_report
                        userPermissions:
                          - permissions:
                              - submit
                            userId: USER123A
                        groupPermissions:
                          - permissions:
                              - manage
                            roleKey: hq_access_level:admin
                            roleName: Admin
                        createdBy: USER123A
                        updatedAt: '2020-11-20T16:13:33.615127+00:00'
                        isPdf: true
                        pdfUrl: https://link.to/form.pdf
                        forms:
                          url: https://developer.api.autodesk.com/construction/forms/v1/projects/9ba6681e-1952-4d54-aac4-9de6d9858dd4/forms?templateId=2f634a22-779d-4930-9f08-8391a41fea05
                        currentLayoutId: 123e4567-e89b-12d3-a456-426614174000
                    pagination:
                      offset: 0
                      limit: 50
                      totalResults: 1
                      nextUrl: null
        '400':
          description: The request is invalid due to malformed syntax or a missing request header.
        '401':
          description: The request lacks valid authentication credentials.
        '403':
          description: The client is authenticated but does not have permission to access the resource.
        '404':
          description: The resource cannot be found.
        '429':
          description: The request exceeds the rate limit for this resource.
        '500':
          description: The request failed due to an internal server error.
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/construction/forms/v1/projects/{projectId}/form-templates" -H "Authorization: Bearer AuIPTf4KYLTYGVnOHQ0cuolwCW2a"'
  '/construction/forms/v1/projects/{projectId}/layouts/{layoutId}':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: layoutId
        in: path
        required: true
        description: The unique identifier of the layout.
        schema:
          type: string
    get:
      tags:
        - Templates
      summary: Get Layout
      operationId: getLayout
      description: |-
        Returns layout information for a form template.

        Layouts define the structure and configuration of form templates, including sections, fields, and their properties.
      responses:
        '200':
          description: Layout information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDetail'
              examples:
                example-1:
                  value:
                    layout:
                      uid: 123e4567-e89b-12d3-a456-426614174000
                      type: form
                      description: Standard form layout for field reports
                      hasSectionAssignees: false
                    sections:
                      - uid: 123e4567-e89b-12d3-a456-426614174001
                        layoutUid: 123e4567-e89b-12d3-a456-426614174000
                        sortIndex: 0
                        displayIndex: 0
                        type: section
                        assigneeType: user
                        assigneeId: ''
                        label: General Information
                        description: ''
        '400':
          description: The request is invalid due to malformed syntax or a missing request header.
        '401':
          description: The request lacks valid authentication credentials.
        '403':
          description: The client is authenticated but does not have permission to access the resource.
        '404':
          description: The resource cannot be found.
        '429':
          description: The request exceeds the rate limit for this resource.
        '500':
          description: The request failed due to an internal server error.
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/construction/forms/v1/projects/{projectId}/layouts/{layoutId}" -H "Authorization: Bearer AuIPTf4KYLTYGVnOHQ0cuolwCW2a"'
  '/construction/forms/v2/projects/{projectId}/layouts/{layoutId}/sections/{sectionId}':
