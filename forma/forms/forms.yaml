      description: |-
        Returns the field values extracted from a PDF-based form as a paginated list of name/value pairs, where name is the PDF field name and value is the entered value.

        These values were previously returned as part of the form response by the deprecated GET forms endpoint. If you are migrating from v1 to v2, see the Forms API Migration Guide.

