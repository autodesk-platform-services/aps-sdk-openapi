  '/construction/forms/v1/projects/{projectId}/forms/{formId}/table/{fieldId}/values':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FormId'
      - name: fieldId
        in: path
        required: true
        description: |-
          The table's schema identifier (UUID). This corresponds to the schema and fieldId fields returned in each row of the response. For built-in tables, use the following UUIDs: - Work Log: 6c8055d5-1301-46f6-9d18-8a2a208a277e - Materials: 2adf5ad9-d9d3-ee42-6fd8-015c34ce474d - Equipment: 8af6c450-dd2a-32ae-0090-5493a9cc884e For custom tables, start with the form's layoutId and use GET layout to find the section that contains the table. Then use GET section and look for the item in sectionItems[] whose type is table; its schema value is the fieldId.
        schema:
          type: string
    get:
      tags:
        - Forms
      summary: Get Table Values
      operationId: getTableValues
      description: |-
        Returns all row values from a specific table in a form.

        This endpoint allows you to retrieve tabular data from forms, including work log entries, materials entries, equipment entries, and custom tables.

        The fieldId path parameter is the table's schema identifier (UUID). Each row in the response will include both schema and fieldId fields that match this identifier.

        Column Types

        Custom tables support multiple column types. Each cell value uses a type-specific field: - textVal: Text values - numberVal: Decimal numbers - integerVal: Whole numbers - arrayVal: Dropdown/multi-select choices - uidVal: Reference IDs (companies, roles) - svgVal: Signatures (base64 SVG) - dateVal: Dates (YYYY-MM-DD) - timeVal: Times (HH:MM:SS) - timespanVal: Duration in milliseconds

        Use GET section to see each column's columnType and determine which value field to read.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LimitTableValues'
      responses:
        '200':
          description: Table values from the form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValuesPage'
              examples:
                example-1:
                  value:
                    data:
                      - id: 28a31f14-d963-42a3-bf98-d38b73e7aba3
                        table: worklogEntries
                        schema: 6c8055d5-1301-46f6-9d18-8a2a208a277e
                        fieldId: 6c8055d5-1301-46f6-9d18-8a2a208a277e
                        rank: 1
                        deleted: false
                        columns:
