        '500':
          description: The request failed due to an internal server error.
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/construction/forms/v2/projects/{projectId}/layouts/{layoutId}/sections/{sectionId}" -H "Authorization: Bearer AuIPTf4KYLTYGVnOHQ0cuolwCW2a"'
  '/construction/forms/v2/projects/{projectId}/forms':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Forms
      summary: Get Forms
      operationId: getFormsV2
      description: |-
        Returns a paginated list of forms in a project.

        Forms are sorted by updatedAt in ascending order by default (oldest first).

        Note: For PDF forms, pdfFile references the PDF document; to retrieve the field values entered into the PDF, use the GET PDF values endpoint. For web forms, nativeForm includes general form data and layout information. To retrieve custom field values or table values for web forms, use the GET custom values and GET table values endpoints respectively.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LimitMax50'
        - name: ids
          in: query
          required: false
          description: An array of Form IDs to retrieve.
          schema:
            type: array
            items:
              type: string
        - name: formDateMin
          in: query
          required: false
          description: Return Forms with formDate at or after specified date.
          schema:
            type: string
        - name: formDateMax
          in: query
          required: false
          description: Return Forms with formDate at or before specified date.
          schema:
            type: string
        - name: updatedAfter
          in: query
          required: false
          description: Return Forms updated at or after a specified time.
          schema:
            type: string
            format: date-time
        - name: updatedBefore
          in: query
          required: false
          description: Return Forms updated at or before a specified time.
          schema:
            type: string
            format: date-time
        - name: templateId
          in: query
          required: false
          description: Return Forms on template with given ID.
          schema:
            type: string
        - name: statuses
          in: query
          required: false
          description: Return Forms with given statuses.
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          required: false
          description: |
            A string that specifies how to sort returned objects. The string provides a valid name (formDate, updatedAt, status, formNum, description, dueDate, templateName, createdByName, updatedByName) with an optional direction, either asc (ascending) or desc (descending). The string may contain multiple comma-separated expressions (max of 3) for secondary sorts. The default sort order is asc if not provided. Example: updatedAt desc,formNum asc
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search for forms containing the exact match of the specified text.
          schema:
            type: string
        - name: locationIds
          in: query
          required: false
          description: 'A sequence of location IDs. Each returned objects must/will be associated with one of the locations specified by the IDs.'
          schema:
            type: array
            items:
              type: string
        - name: includeSubLocations
          in: query
          required: false
          description: Include forms associated with sublocations of the specified locationIds.
          schema:
            type: boolean
        - name: include
          in: query
          required: false
          description: 'Include the specified extra fields. You can specify multiple values by repeating the parameter (e.g., include=sublocations&include=layoutInfo). Possible values: sublocations, inactiveFormTemplates, layoutInfo.'
          schema:
            type: array
            items:
              type: string
              enum:
                - sublocations
                - inactiveFormTemplates
                - layoutInfo
      responses:
        '200':
          description: Forms in project at specified page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsV2Page'
              examples:
                example-1:
                  value:
                    data:
                      - formTemplateId: 2f634a22-779d-4930-9f08-8391a41fea05
                        id: 932da979-e537-4530-b8aa-18607ac6db37
                        status: draft
