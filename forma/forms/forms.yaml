  '/construction/forms/v3/projects/{projectId}/weather/{weatherId}':
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: weatherId
        in: path
        required: true
        description: The unique identifier of the weather record. Use GET forms to retrieve the weather ID from a form's weatherId field.
        schema:
          type: integer
    get:
      tags:
        - Weather
      summary: Get Weather
      operationId: getWeather
      description: |-
        Returns weather data for a specific weather record associated with a project.

        Weather data is returned in metric units: - Temperature values (temp, temperatureMin, temperatureMax) are in Celsius - Wind speed values (windSpeed, windGust) are in kilometers per hour (km/h) - Precipitation values (precipitationAccumulation) are in millimeters (mm)

        Weather records are created when forms capture weather conditions. Use the weatherId from a form to retrieve the full weather details.
      responses:
        '200':
          description: Weather data in metric units.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
              examples:
                example-1:
                  value:
                    id: 12345
                    summaryKey: CLEAR
                    precipitationType: RAIN
                    precipitationAccumulation: 12.7
                    hourlyWeather:
                      - id: 67890
                        summaryKey: PARTLY_CLOUDY
                        hour: '12:00:00'
                        temp: 22.5
                        windSpeed: 16.9
                        windBearing: 225
                        windBearingKey: SW
                        humidity: 0.65
                    provider: WEATHER_KIT
                    fetchedAt: '2024-01-20T14:30:00+00:00'
