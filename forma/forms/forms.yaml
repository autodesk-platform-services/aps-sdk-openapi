        description: The unique identifier of the layout.
        schema:
          type: string
      - name: sectionId
        in: path
        required: true
        description: The unique identifier of the section.
        schema:
          type: string
    get:
      tags:
        - Templates
      summary: Get Layout Section
      operationId: getLayoutSection
      description: |-
        Returns detailed information about a specific section within a form layout.

        Sections contain form fields, tables, and other UI elements that make up the structure of a form.
