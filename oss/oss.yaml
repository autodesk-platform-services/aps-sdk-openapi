openapi: 3.0.1
info:
  title: oss
  version: '1.0'
  description: 'The Object Storage Service (OSS) allows your application to download and upload raw files (such as PDF, XLS, DWG, or RVT) that are managed by the Data service.'
  contact:
    name: Autodesk Platform Services
    url: 'https://aps.autodesk.com/'
    email: aps.help@autodesk.com
  termsOfService: 'https://www.autodesk.com/company/legal-notices-trademarks/terms-of-service-autodesk360-web-services/forge-platform-web-services-api-terms-of-service'
  x-support: 'https://stackoverflow.com/questions/tagged/autodesk-data-management'
servers:
  - url: 'https://developer.api.autodesk.com'
tags:
  - name: Buckets
    description: Bucket related operations
  - name: Objects
    description: Object related operations
  - name: Upload Workflow
    description: Operations for uploading an object directly to S3 using signed URLs.
  - name: Download Workflow
    description: Operations for downloading an object directly from S3 using signed URLs.
  - name: Batch Upload Workflow
    description: Operations for uploading a set of objects directly to S3 using signed URLs.
  - name: Batch Download Workflow
    description: Operations for downloading a set of objects directly from S3 using signed URLs.
  - name: Public Links
    description: Operations for generating and using OSS signed URLs to share objects across applications.
paths:
  /oss/v2/buckets:
    get:
      tags:
        - Buckets
      summary: List Buckets
      description: |
        Retrieves a list of buckets owned by the calling application.
      operationId: getBuckets
      parameters:
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/startAt'
      responses:
        '200':
          description: The list of buckets was successfully retrieved.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/BucketsPage'
            application/json:
              examples:
                basic-list:
                  summary: Basic Successful List Bucket (200)
                  value:
                    items:
                    - bucketKey: 00001fbf-8505-49ab-8a42-44c6a96adbd0
                      createdDate: 1441329298362
                      policyKey: transient
                    - bucketKey: 0003114d
                      createdDate: 1440119769765
                      policyKey: transient
                    - bucketKey: 0003fbc1-389a-4194-915a-38313797d753
                      createdDate: 1453886285506
                      policyKey: transient
                    - bucketKey: 00048aa5
                      createdDate: 1436255268102
                      policyKey: transient
                    - bucketKey: 000524bf
                      createdDate: 1453197455111
                      policyKey: transient
                    - bucketKey: 0006db6d
                      createdDate: 1461978883040
                      policyKey: transient
                    - bucketKey: 00074953-5d83-4aeb-b598-8f727703c94e
                      createdDate: 1447934893704
                      policyKey: transient
                    - bucketKey: 00085601-78b2-44e4-82f3-a252fde022d2
                      createdDate: 1441504885576
                      policyKey: transient
                    - bucketKey: 000b1e61-216e-4480-bcd3-9ec5ca56364f
                      createdDate: 1448268266859
                      policyKey: transient
                    - bucketKey: 000e37cc
                      createdDate: 1437441338604
                      policyKey: transient
                    next: https://developer.api.autodesk.com/oss/v2/buckets?region=US&startAt=000e37cc
              schema:
                $ref: '#/components/schemas/BucketsPage'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets" -X GET -H "Authorization: Bearer RhS6iEVMnEfl77MBSK3l2je06UHj"'
    post:
      tags:
        - Buckets
      summary: Create Bucket
      description: |
        Creates a new bucket.

        Buckets are virtual containers within the Object Storage Service (OSS), which you can use to store and manage objects (files) in the cloud. The application creating the bucket is the owner of the bucket.

        **Note:** Do not use this operation to create buckets for BIM360 Document Management. Use [POST projects/{project_id}/storage](/en/docs/data/v2/reference/http/projects-project_id-storage-POST>) instead. For details, see [Upload Files to BIM 360 Document Management](/en/docs/bim360/v1/tutorials/document-management/upload-document).
      operationId: createBucket
      parameters:
        - $ref: '#/components/parameters/region_header'
      requestBody:
        content:
          application/json:
            examples:
              success:
                summary: Create bucket - Success (200)
                value:
                  bucketKey: apptestbucket
                  policyKey: transient
            schema:
              $ref: '#/components/schemas/CreateBucketsPayload'
        required: true
      responses:
        '200':
          description: The bucket was successfully created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Bucket'
            application/json:
              examples:
                success:
                  summary: Create bucket - Success (200)
                  value:
                    bucketKey: apptestbucket
                    bucketOwner: RlKfGlAbb7N8VJwLllOvpfonB1Ex52qG
                    createdDate: 1463785698600
                    permissions:
                    - authId: RlKffonB1Ex52GlAbb7N8VJwLllOvpqG
                      access: full
                    policyKey: transient
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '409':
          description: The specified bucket key already exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Reason'
            application/json:
              examples:
                conflict:
                  summary: Create Bucket - Conflict (409)
                  value:
                    reason: Bucket already exists
              schema:
                $ref: '#/components/schemas/Reason'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:create'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets" -X POST -H "Content-Type: application/json" -H "Authorization: Bearer kgEJWMJitdYbhfxghap8SbZqXMoS" -d  ''{"bucketKey":"apptestbucket","policyKey":"transient"}'''
  '/oss/v2/buckets/{bucketKey}':
    delete:
      tags:
        - Buckets
      summary: Delete Bucket
      description: |
        **WARNING:** This operation permanently deletes the specified bucket. It cannot be undone.

        Deletes the specified bucket. Only the application that owns the bucket can call this operation. All other applications that call this operation will receive a "403 Forbidden" error.

        The initial processing of a bucket deletion request can be time-consuming. So, we recommend only deleting buckets containing a few objects, like those typically used for acceptance testing and prototyping.

        **Note:** Bucket keys of deleted buckets will not be immediately available for reuse.

        **Tip:** You can use the [Protect Bucket](/en/docs/data/v2/reference/http/oss/post-oss-v2-buckets-bucketkey-pr-POST/) operation to prevent accidental deletion.
      operationId: deleteBucket
      parameters:
        - name: bucketKey
          in: path
          description: The unique identifier of the bucket to delete.
          required: true
          schema:
            pattern: '^[-_.a-z0-9]{3,128}$'
            type: string
      responses:
        '200':
          description: The bucket deletion request was accepted.
          content: {}
        '400':
          description: The request could not be processed due to malformed syntax or missing headers.
          content: {}
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: 'The specified ``bucketKey`` does not exist.'
          content: {}
        '409':
          description: The specified bucket is already marked for deletion.
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:delete'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/bucketexamplekey" -X DELETE -H "Authorization: Bearer kuhodzPEHSCrWH3Pm1WuBMBnxw39"'
  '/oss/v2/buckets/{bucketKey}/details':
    get:
      tags:
        - Buckets
      summary: Get Bucket Details
      description: |
        Retrieves detailed information about the specified bucket.

        **Note:** Only the application that owns the bucket can call this operation. All other applications that call this operation will receive a "403 Forbidden" error.
      operationId: getBucketDetails
      parameters:
        - name: bucketKey
          in: path
          description: The unique identifier of the bucket to retrieve details for.
          required: true
          schema:
            pattern: '^[-_.a-z0-9]{3,128}$'
            type: string
      responses:
        '200':
          description: The bucket details were successfully retrieved.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Bucket'
            application/json:
              examples:
                success:
                  summary: Successful Bucket Details (200)
                  value:
                    bucketKey: apptestbucket
                    bucketOwner: RlKffonB1Ex52GlAbb7N8VJwLllOvpqG
                    createdDate: 1463785698600
                    permissions:
                    - authId: RlKffonB1Ex52GlAbb7N8VJwLllOvpqG
                      access: full
                    policyKey: transient
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: 'The specified ``bucketKey`` does not exist.'
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:read'
            - 'viewables:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/details" -X GET -H "Authorization: Bearer efxXBK0aTv3MjSSQ6HbDsjnYRmCU" -H "Content-Type: application/json"'
  '/oss/v2/buckets/{bucketKey}/transfer':
    post:
      tags:
        - Buckets
      summary: Transfer Bucket Ownership
      description: |
        Transfers ownership of a bucket from one application to another.

        Ownership transfer is a two-step process:

        - The current owner initiates the transfer.
        - The target application accepts the transfer.

        Once a transfer is initiated, the bucket enters a transitional state in which both the current owner and the target application have full ownership privileges and can perform the same bucket operations. The only exception is the List Buckets operation, which lists the bucket only for the target application.

        The transfer is completed when the target application accepts the transfer. At that point, the target application becomes the sole owner of the bucket.

        **Note:**

        - Transferring a bucket changes only the bucket owner. Ownership of existing objects within the bucket is not changed.
        - Existing objects retain the ownership metadata of the application that originally uploaded them.
        - After the transfer is completed, the new bucket owner has full access to all objects in the bucket, regardless of the original object owner.
        - Transfer requests do not currently expire. A transfer may remain in the transitional state indefinitely until it is accepted by the target application. However, long-term reliance on this transitional state is not recommended.
      operationId: transferBucketOwnership
      parameters:
        - name: bucketKey
          in: path
          description: The unique identifier of the bucket whose ownership is being transferred. The bucket key must be URL-encoded.
          required: true
          schema:
            pattern: '^[-_.a-z0-9]{3,128}$'
            type: string
      requestBody:
        content:
          application/json:
            examples:
              initiate:
                summary: Transfer Bucket Ownership - Initiate Transfer (200). This example demonstrates successfully initiating the transfer of ownership of a bucket named bucket-to-transfer from one application to another application with the client ID RCLoDyASA82T41wpqYv5b2QrgHrcofVY.
                value:
                  operation: initiate
                  key: RCLoDyASA82T41wpqYv5b2QrgHrcofVY
              cancel:
                summary: Transfer Bucket Ownership - Cancel Transfer (200). This example demonstrates successfully canceling the transfer of ownership of the bucket named bucket-to-transfer.
                value:
                  operation: cancel
              complete:
                summary: Transfer Bucket Ownership - Complete Transfer (200). This example demonstrates successfully accepting the transfer of ownership of the bucket named bucket-to-transfer.
                value:
                  operation: complete
            schema:
              $ref: '#/components/schemas/TransferBucketOwnershipPayload'
        required: true
      responses:
        '200':
          description: The transfer request was successfully accepted by the service.
          content: {}
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:update'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/bucket-to-transfer/transfer" -X POST -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json" --data ''{"operation":"initiate","key":"RCLoDyASA82T41wpqYv5b2QrgHrcofVY"}'''
  '/oss/v2/buckets/{bucketKey}/protect':
    post:
      tags:
        - Buckets
      summary: Protect Bucket
      description: |
        Modifies the protection status of the specified bucket. When you protect a bucket, it cannot be deleted until you explicitly unprotect it. When you unprotect a bucket, it becomes eligible for deletion again.

        You must be the owner of the bucket or have appropriate permissions to modify bucket protection settings.

        This operation is idempotent. Protecting an already protected bucket or unprotecting an already unprotected bucket will not result in an error.

        The protection status change takes effect immediately upon successful completion of the operation.
      operationId: protectBucket
      parameters:
        - name: bucketKey
          in: path
          description: The unique identifier of the bucket whose protection status is being modified. The bucket key must be URL-encoded.
          required: true
          schema:
            pattern: '^[-_.a-z0-9]{3,128}$'
            type: string
      requestBody:
        content:
          application/json:
            examples:
              protect:
                summary: Basic Successful Protect Bucket (200)
                value:
                  protection: true
              unprotect:
                summary: Basic Successful Unprotect Bucket (200)
                value:
                  protection: false
            schema:
              $ref: '#/components/schemas/ProtectBucketPayload'
        required: true
      responses:
        '200':
          description: 'The bucket protection status was successfully updated. If protection was set to ``true``, bucket protection is now enabled; if set to ``false``, it is now disabled.'
          content:
            text/plain:
              examples:
                protect:
                  summary: Basic Successful Protect Bucket (200)
                  value: Bucket prodbucket_03 protection set to true
                unprotect:
                  summary: Basic Successful Unprotect Bucket (200)
                  value: Bucket prodbucket_03 protection set to false
              schema:
                type: string
                description: Returns a string indicating protection status.
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'bucket:update'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/prodbucket_03/protect" -X POST -H "Authorization: Bearer eyJh..." -H "Content-Type: application/json" -H "x-ads-region: US" --data ''{"protection":true}'''
  '/oss/v2/buckets/{bucketKey}/objects/{objectKey}':
    delete:
      tags:
        - Objects
      summary: Delete Object
      description: Deletes the specified object from the bucket.
      operationId: deleteObject
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - $ref: '#/components/parameters/objectKey'
      responses:
        '200':
          description: The object was successfully deleted.
          content: {}
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: 'The specified ``bucketKey`` or ``objectKey`` does not exist.'
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:write'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/bucketexamplekey/objects/objectKey" -X DELETE -H "Authorization: Bearer kuhodzPEHSCrWH3Pm1WuBMBnxw39" -H "Content-Type: application/json;charset=UTF-8"'
  '/oss/v2/buckets/{bucketKey}/objects':
    get:
      tags:
        - Objects
      summary: List Objects
      description: |
        Retrieves a list of objects in the specified bucket.

        Only the application that owns the bucket can call this operation. All other applications that call this operation will receive a "403 Forbidden" error.
      operationId: getObjects
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - $ref: '#/components/parameters/limit'
        - name: beginsWith
          in: query
          description: Filters the results by the value you specify. Only the objects with their ``objectKey`` beginning with the specified string are returned.
          schema:
            type: string
        - $ref: '#/components/parameters/startAt'
      responses:
        '200':
          description: The requested objects were successfully retrieved.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/BucketObjectsPage'
            application/json:
              examples:
                success:
                  summary: Successful object list (200)
                  value:
                    items:
                    - bucketKey: apptestbucket
                      objectKey: objectKeyFoo
                      objectId: urn:adsk.objects:os.object:apptestbucket/objectKeyFoo
                      sha1: cdbf71bfc07cbc18372a5dd4b6e161463cb7fd35
                      size: 7
                      location: https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/objectKeyFoo
                    next: https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects?startAt=objectKeyFoo&limit=1
              schema:
                $ref: '#/components/schemas/BucketObjectsPage'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects?limit=1" -X GET -H "Authorization: Bearer ShiAeQ67rdNSfmyEmtGW8Lnrcqto" -H "Content-Type: application/json"'
  '/oss/v2/buckets/{bucketKey}/objects/{objectKey}/details':
    get:
      tags:
        - Objects
      summary: Get Object Details
      description: Retrieves detailed information about the specified object.
      operationId: getObjectDetails
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - $ref: '#/components/parameters/objectKey'
        - $ref: '#/components/parameters/If-Modified-Since'
        - $ref: '#/components/parameters/with'
      responses:
        '200':
          description: The object details were successfully retrieved.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ObjectFullDetails'
            application/json:
              examples:
                success:
                  summary: Get Object Details - Success (200)
                  value:
                    bucketKey: apptestbucket
                    objectId: urn:adsk.objects:os.object:apptestbucket/test.txt
                    objectKey: test.txt
                    sha1: 33a16388013ce310564af70b0ef5320d8fd85444
                    size: 618
                    contentType: application/x-www-form-urlencoded
                    location: https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/test.txt
                    blockSizes:
                    - 2048
              schema:
                $ref: '#/components/schemas/ObjectFullDetails'
        '304':
          description: The object has not been modified since the specified date.
          content: {}
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: 'The specified ``bucketKey`` or ``objectKey`` does not exist.'
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/test.txt/details" -X GET -H "Authorization: Bearer ShiAeQ67rdNSfmyEmtGW8Lnrcqto" -H "Content-Type: application/json"'
  '/oss/v2/buckets/{bucketKey}/objects/{objectKey}/signed':
    post:
      tags:
        - Public Links
      summary: Generate Signed OSS URL
      description: |
        Generates a signed URL for downloading or uploading an object within a specified time limit. If the target object is deleted or expires before the signed URL expires, the URL becomes invalid.

        OSS offers two types of signed URLs:

        - S3 Signed URLs: Enable direct S3 upload/download but are restricted to bucket owners only.
        - OSS Signed URLs (the type generated by this operation): Also support upload/download operations and can be configured for access by other applications, making them ideal for sharing objects across different systems.

        **Important:** Only the application that owns the bucket can generate a signed OSS URL. Once generated, any permitted application can use the signed URL to access the object.
      operationId: createSignedResource
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - $ref: '#/components/parameters/objectKey'
        - $ref: '#/components/parameters/access'
        - name: useCdn
          in: query
          description: |
            Determines whether the generated signed URL should use a CloudFront URL instead of an Autodesk URL. Possible values:

            - ``true`` : Returns a CloudFront URL to the object instead of an Autodesk URL (one that points to a location on https://developer.api.autodesk.com). Applications can interact with the CloudFront URL exactly like with any classic public resource in OSS. They can use GET requests to download objects or PUT requests to upload objects.
            - ``false`` : (Default) Returns an Autodesk URL (one that points to a location on https://developer.api.autodesk.com) to the object.
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            examples:
              with-expiration:
                summary: Successful Creation of Signed URL with Expiration Time and Read Access (200)
                value:
                  minutesExpiration: 30
            schema:
              $ref: '#/components/schemas/CreateSignedResourcePayload'
      responses:
        '200':
          description: The signed URL was successfully generated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SignedResource'
            application/json:
              examples:
                basic:
                  summary: Successful Creation of Signed URL (200)
                  value:
                    signedUrl: https://developer.api.autodesk.com/oss/v2/apptestbucket/758955fa-58fa-46ba-a906-11fe2a3a1a08?region=US
                    expiration: 1462989939869
                    singleUse: false
                single-use-readwrite:
                  summary: Successful Creation of Signed, Single-Use URL with Expiration Time and Read-Write Access (200)
                  value:
                    signedUrl: https://developer.api.autodesk.com/oss/v2/apptestbucket/9d3be632-a4fc-457d-bc5d-9e75cefc54b7?region=US
                    expiration: 1464141609620
                    singleUse: true
                cloudfront:
                  summary: Successful Creation of Signed, Single-Use URL with Expiration Time using CloudFront (200)
                  value:
                    signedUrl: https://cdn.oss.api.autodesk.com/oss/v2/signedresources/42231c8b-0132-4218-86b2-30c68150697d?region=US
                    expiration: 1464141609620
                    singleUse: true
              schema:
                $ref: '#/components/schemas/SignedResource'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:write'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/test.txt/signed?access=read" -X POST -H "Authorization: Bearer L1yVvPcJDWel0oV3xlYnq7AMZIQE" -H "Content-Type: application/json;charset=UTF-8" --data ''{"minutesExpiration":30}'''
  '/oss/v2/signedresources/{hash}':
    parameters:
      - name: hash
        in: path
        description: |
          The ID component of the signed URL.

          **Note:** The signed URL returned by [Generate Signed OSS URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signed-POST/) contains ``hash`` as a URI parameter.
        required: true
        schema:
          type: string
    get:
      tags:
