      summary: Download Object Using Signed URL
      description: |
        Downloads an object using an OSS signed URL.

        **Note:** The signed URL returned by [Generate Signed OSS URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signed-POST/) contains the ``hash`` URI parameter.
      operationId: getSignedResource
