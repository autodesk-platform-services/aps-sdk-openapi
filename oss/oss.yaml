    post:
      tags:
        - Upload Workflow
      summary: Complete Upload to S3 Signed URL
      description: Completes the upload to the S3 signed URL by assembling and reconstituting the object from uploaded chunks. You must call this operation only after all parts/chunks of the object have been uploaded. This operation must be performed even if only 1 chunk was uploaded.
      operationId: completeSignedS3Upload
      parameters:
        - name: Content-Type
          in: header
          description: Must be ``application/json``.
          required: true
          schema:
            type: string
        - name: x-ads-meta-Content-Type
          in: header
          description: The Content-Type value for the uploaded object to record within OSS.
          schema:
            type: string
        - name: x-ads-meta-Content-Disposition
          in: header
          description: The Content-Disposition value for the uploaded object to record within OSS.
          schema:
            type: string
        - name: x-ads-meta-Content-Encoding
          in: header
          description: The Content-Encoding value for the uploaded object to record within OSS.
          schema:
            type: string
        - name: x-ads-meta-Cache-Control
          in: header
          description: The Cache-Control value for the uploaded object to record within OSS.
          schema:
            type: string
        - name: x-ads-user-defined-metadata
          in: header
          description: 'Custom metadata to be stored with the object, which can be retrieved later on download or when retrieving object details. Must be a JSON object that is less than 100 bytes.'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              success:
                summary: Request to complete the object creation process after the bytes have been uploaded directly to S3. (200).
                value:
                  uploadKey: '{UPLOAD_KEY_PROVIDED_FROM_GET_UPLOAD_URLS_RESPONSE}'
              validation-failure:
                summary: Request to complete the object creation process after the bytes have been uploaded directly to S3 with Size and ETag validation (200).
                value:
                  uploadKey: '{UPLOAD_KEY_PROVIDED_FROM_GET_UPLOAD_URLS_RESPONSE}'
                  size: 1
                  eTags:
                  - c4ca4238a0b923820dcc509a6f75849b
                  - 68ed4d53c0c933b7bf7debbd640386b1
                  - 12ee9a859b60e71df4ef727f41c6b6d8
            schema:
              $ref: '#/components/schemas/CompleteS3UploadPayload'
        required: true
      responses:
        '200':
          description: 'The upload operation completed. The response body depends on whether the request includes the ``size`` and/or ``eTags`` properties. If these properties are omitted, the response contains the completed object''s details. If either property is specified, the response contains the results of validating the uploaded object.'
          content:
            application/json:
              examples:
                success:
                  summary: Request to complete the object creation process after the bytes have been uploaded directly to S3. (200).
                  value:
                    bucketKey: apptestbucket
                    objectId: urn:adsk.objects:os.object:apptestbucket/random_file.bin
                    objectKey: random_file.bin
                    size: 12582912
                    contentType: application/octet-stream
                    location: https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/random_file.bin
                validation-failure:
                  summary: Request to complete the object creation process after the bytes have been uploaded directly to S3 with Size and ETag validation (200).
                  value:
                    uploadKey: '{UPLOAD_KEY}'
                    status: error
                    reason: MissingOrInvalidParts
                    size:
                      expected: 1
                      detected: 12582912
                    parts:
                    - part: 1
                      size: 5242880
                      eTag: 9aec28c3d07e2978e6502f6427c515da
                      status: Unexpected
                    - part: 2
                      size: 5242880
                      eTag: 68ed4d53c0c933b7bf7debbd640386b1
                      status: Ok
                    - part: 3
                      size: 2097152
                      eTag: 12ee9a859b60e71df4ef727f41c6b6d8
                      status: Ok
              schema:
                $ref: '#/components/schemas/CompleteS3Upload'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: The specified object or bucket does not exist.
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:write'
            - 'data:create'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/random_file.bin/signeds3upload" -X POST -H "Authorization: Bearer eYeL5gYxAT2j3u9TEerxoJoToNbi" -H "Content-Type: application/json" -H "x-ads-meta-Content-Type: application/octet-stream" --data-raw ''{"uploadKey":"{UPLOAD_KEY_PROVIDED_FROM_GET_UPLOAD_URLS_RESPONSE}"}'''
components:
  schemas:
    Reason:
      required:
        - reason
      type: object
      properties:
        reason:
          type: string
          description: reason for failure
      description: An object returned with an error describing the reason for failure.
    CreateBucketsPayload:
      type: object
      description: The request payload for the Create Bucket operation.
      properties:
        bucketKey:
          type: string
          description: |
            Bucket key: A unique name you assign to a bucket. Bucket keys must be globally unique across all applications and regions. They must consist of only lower case characters, numbers 0-9, and underscores (_).

            **Note:** You cannot change a bucket key once the bucket is created.
        allow:
          type: array
          description: 'An array of objects, where each object represents an application that can access the bucket. A bucket can be accessed by 60 applications in total, including the owner. Because the creating application already counts as one, you can specify up to 59 additional applications.'
          items:
            $ref: '#/components/schemas/CreateBucketsPayloadAllow'
        policyKey:
          $ref: '#/components/schemas/PolicyKey'
      required:
        - bucketKey
        - policyKey
    TransferBucketOwnershipPayload:
      type: object
      description: The request payload for the Transfer Bucket Ownership operation.
      required:
        - operation
      properties:
        operation:
          type: string
          enum:
            - initiate
            - complete
            - cancel
          description: |
            The transfer operation to perform. Possible values:

            - ``initiate`` : Initiates a bucket ownership transfer by specifying the target application that will become the new owner. This operation can only be performed by the current bucket owner.
            - ``complete`` : Accepts and completes a pending bucket ownership transfer. This operation can only be performed by the target application specified when the transfer was initiated.
            - ``cancel`` : Cancels a pending bucket ownership transfer before it is completed. This operation can be performed by either the current bucket owner or the target application.
        key:
          type: string
          description: |
            The client ID of the application that will become the new bucket owner. ``key`` must be specified only when ``operation`` is set to ``initiate``. It must not be specified when ``operation`` is ``complete`` or ``cancel``.

            **Important:** The service does not validate ``key``. If you specify an invalid client ID, the request still returns HTTP status 200. After a successful ``initiate`` request, the bucket enters a transitional state even when ``key`` is invalid.
    ProtectBucketPayload:
      type: object
      description: The request payload for the Set Bucket Protection operation.
      properties:
        protection:
          type: boolean
          description: |
            Sets the protection status of the bucket. Possible values:

            - ``true`` : Protects the bucket from accidental deletion.
            - ``false`` : Leaves the bucket unprotected or removes protection from a previously protected bucket.
    ObjectDetails:
      type: object
      properties:
        bucketKey:
          type: string
          description: The bucket key of the bucket that contains the object.
        objectId:
          type: string
          description: An identifier (URN) that uniquely and persistently identifies the object.
        objectKey:
          type: string
          description: A URL-encoded human-friendly name that identifies the object.
        sha1:
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          type: string
          description: A hash value computed from the data of the object.
          format: byte
        size:
          type: integer
          description: 'The total amount of storage space occupied by the object, in bytes.'
          format: int64
        contentType:
          type: string
          description: 'The format of the data stored within the object, expressed as a MIME type.'
        location:
          type: string
          description: A URL that points to the actual location of the object.
      description: Represents an object within a bucket.
    ObjectFullDetails:
      type: object
      description: Represents detailed information about an object within a bucket.
      properties:
        bucketKey:
          type: string
          description: The bucket key of the bucket that contains the object.
        objectId:
          type: string
          description: An identifier (URN) that uniquely and persistently identifies the object.
        objectKey:
          type: string
          description: A URL-encoded human-friendly name that identifies the object.
        sha1:
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          type: string
          description: A hash value computed from the data of the object.
          format: byte
        size:
          type: integer
          description: 'The total amount of storage space occupied by the object, in bytes.'
          format: int64
        contentType:
          type: string
          description: 'The format of the data stored within the object, expressed as a MIME type.'
        location:
          type: string
          description: A URL that points to the actual location of the object.
        createdDate:
          type: integer
          format: int64
          description: 'The time the object was created, represented as a Unix timestamp. Only returned if explicitly requested using the ``with`` query string parameter.'
        lastAccessedDate:
          type: integer
          format: int64
          description: 'The time the object was last accessed, represented as a Unix timestamp. Only returned if explicitly requested using the ``with`` query string parameter.'
        lastModifiedDate:
          type: integer
          format: int64
          description: 'The time the object was most recently modified, represented as a Unix timestamp. Only returned if explicitly requested using the ``with`` query string parameter.'
        userDefinedMetadata:
          type: string
          description: 'Any custom metadata, if available. Only returned if explicitly requested using the ``with`` query string parameter.'
        blockSizes:
          type: array
          description: 'The sizes of the blocks the object is stored in, in bytes.'
          items:
            type: integer
            format: int64
    CreateSignedResourcePayload:
      type: object
      description: The request payload for a Generate Signed OSS URL operation.
      properties:
        minutesExpiration:
          type: integer
          description: |
            The time window (in minutes) the signed URL will remain usable. Acceptable values = 1-60 minutes. Default = 2 minutes.

            **Tip:** Use the smallest possible time window to minimize exposure of the signed URL.
        singleUse:
          type: boolean
          description: |
            Sets whether the signed URL expires after a single use. Possible values:

            - ``true`` : The signed URL expires immediately after use. For example, when downloading an object, the URL expires once the download is complete.
            - ``false`` : (Default) The signed URL remains usable for the entire time window specified by ``minutesExpiration``.
    SignedResource:
      required:
        - expiration
        - signedUrl
      type: object
      description: The response payload for a Generate Signed OSS URL operation.
      properties:
        signedUrl:
          type: string
          description: URL created for downloading the object
        expiration:
          type: integer
          description: Value for expiration in minutes
          format: int64
        allowedIpAddresses:
          type: array
          description: IP addresses that can make a request to this URL.
          items:
            type: string
        singleUse:
          type: boolean
          description: |
            Whether the signed URL expires after a single use. Possible values:

            - ``true`` : The signed URL expires immediately after use. For example, when downloading an object, the URL expires once the download is complete.
            - ``false`` : (Default) The signed URL remains usable for the entire time window specified by ``minutesExpiration``.
    Permission:
      type: object
      description: An object representing the permissions for accessing a bucket.
      properties:
        authId:
          type: string
          description: The Client ID of the application.
        access:
          $ref: '#/components/schemas/PermissionAccess'
    Bucket:
      type: object
      description: An object representing a bucket.
      properties:
        bucketKey:
          type: string
          description: 'Bucket key: An ID that uniquely identifies the bucket.'
        bucketOwner:
          type: string
          description: The Client ID of the application that owns the bucket.
        createdDate:
          type: integer
          format: int64
          description: 'The time the bucket was created, represented as a Unix timestamp.'
        permissions:
          type: array
          description: 'An array of objects, where each object represents an application that can access the bucket.'
          items:
            $ref: '#/components/schemas/Permission'
        policyKey:
          $ref: '#/components/schemas/PolicyKey'
    BucketsPage:
      title: BucketsPage
      required:
        - items
      type: object
      description: An object that represents a collection of buckets.
      properties:
        items:
          type: array
          description: 'Array of objects, where each object represents a bucket.'
          items:
            $ref: '#/components/schemas/BucketsItem'
        next:
          type: string
          description: 'The URL to be used to retrieve the next page of results, if available. It will be present only when there are more items to be retrieved after the current set.'
    Result:
      type: object
      description: A response returned by an Upload Object Using Signed URL operation when processing is yet to be completed.
      properties:
        result:
          type: string
          description: A human friendly description of the state of processing.
      required:
        - result
    BucketObjectsPage:
      type: object
      description: An array where each element represents an object in the bucket.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObjectDetails'
        next:
          type: string
          description: 'The URL to be used to retrieve the next page of results, if available. It will be present only when there are more items to be retrieved after the current set.'
    CreateBucketsPayloadAllow:
      type: object
      description: An object that represents the permissions allowed for a bucket.
      required:
        - authId
        - access
      properties:
        authId:
          type: string
          description: The Client ID of the application.
        access:
          $ref: '#/components/schemas/AllowAccess'
    BucketsItem:
      required:
        - bucketKey
        - createdDate
        - policyKey
      type: object
      description: An object containing the properties of a bucket.
      properties:
        bucketKey:
          type: string
          description: 'Bucket key: An ID that uniquely identifies the bucket.'
        createdDate:
          type: integer
          description: 'The time the bucket was created, represented as a Unix timestamp.'
          format: int64
        policyKey:
          $ref: '#/components/schemas/PolicyKey'
    SignedS3Download:
      type: object
      description: An object representing the response payload on successful execution of a Generate Signed S3 Download URL operation.
      properties:
        status:
          $ref: '#/components/schemas/DownloadStatus'
        url:
          type: string
          description: 'A S3 signed URL with which to download the object. This attribute is returned when ``status`` is ``complete`` or ``fallback``; in the latter case, this will return an OSS signed URL, not an S3 signed URL.'
        urls:
          type: object
          description: 'A map of S3 signed URLs, one for each chunk of an unmerged resumable upload. This attribute is returned when ``status`` is ``chunked``. The key of each entry is the byte range of the total file which the chunk comprises.'
        params:
          type: object
          description: |
            The values that were requested for the following parameters when requesting the S3 signed URL.

            - ``Content-Type``
            - ``Content-Disposition``
            - ``Cache-Control``.
        size:
          type: integer
          format: int64
          description: 'The total amount of storage space occupied by the object, in bytes.'
        sha1:
          type: string
          description: 'A hash value computed from the data of the object, if available.'
      required:
        - status
        - params
        - size
    BatchSignedS3Download:
      type: object
      description: The response to a Generate Signed S3 Download URLs (Batch) operation.
      properties:
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DownloadResults'
          description: 'A map of the returned results; each key in the map corresponds to an object key in the batch, and the value includes the results for that object.'
      required:
        - results
    DownloadResults:
      type: object
      description: |
        An object that represents the response to a Generate Signed S3 Download URLs (Batch) operation. 

        **Note**: ``objectKeyN`` is a placeholder for the first object key for which the client requested a download signed URL. The attributes within contain the success data / error information for the request for that object. `results` will contain one such attribute for each requested object in the batch.
      properties:
        status:
          $ref: '#/components/schemas/DownloadStatus'
        url:
          type: string
          description: 'A S3 signed URL with which to download the object. This attribute is returned when ``status`` is ``complete`` or ``fallback``; in the latter case, this will return an OSS signed URL, not an S3 signed URL.'
        urls:
          type: object
          description: 'A map of S3 signed URLs, one for each chunk of an unmerged resumable upload. This attribute is returned when ``status`` is ``chunked``. The key of each entry is the byte range of the total file which the chunk comprises.'
        params:
          type: object
          description: |
            The values that were requested for the following parameters when requesting the S3 signed URL.

            - ``Content-Type``
            - ``Content-Disposition``
            - ``Cache-Control``.
        size:
          type: integer
          format: int64
          description: 'The total amount of storage space occupied by the object, in bytes.'
        sha1:
          type: string
          description: 'A hash value computed from the data of the object, if available.'
        reason:
          type: string
          description: Describes why a signed URL was not returned for this object.
    BatchSignedS3DownloadPayload:
      required:
        - requests
      type: object
      description: The request payload for a Generate Signed S3 Download URLs (Batch) operation.
      properties:
        requests:
          type: array
          description: An array where each element is an object containing information needed to generate a signed S3 download URL.
          items:
            type: object
            properties:
              objectKey:
                type: string
                description: The URL-encoded human friendly name of the object to download.
              response-content-type:
                type: string
                description: 'The value of the Content-Type header you want to receive when you download the object using the signed URL. If you do not specify a value, the Content-Type header defaults to the value stored with OSS.'
              response-content-disposition:
                type: string
                description: 'The value of the Content-Disposition header you want to receive when you download the object using the signed URL. If you do not specify a value, the Content-Disposition header defaults to the value stored with OSS.'
              response-cache-control:
                type: string
                description: 'The value of the Cache-Control header you want to receive when you download the object using the signed URL. If you do not specify a value, the Cache-Control header defaults to the value stored with OSS.'
              If-None-Match:
                type: string
                description: 'The last known ``sha1`` value of the object. OSS returns the signed URL only if the ``If-None-Match`` header differs from the ``sha1`` value of the object on S3. If not, it returns a 304 "Not Modified" HTTP status.'
              If-Modified-Since:
                type: string
                description: 'A timestamp in the HTTP date format (Mon, DD Month YYYY HH:MM:SS GMT). A signed URL is returned only if the object has been modified since the specified timestamp. If not, a 304 (Not Modified) HTTP status is returned.'
    BatchSignedS3Upload:
      type: object
      description: The response to a Batch Generate Signed S3 Upload URLs operation.
      properties:
        results:
          type: object
          additionalProperties:
            type: object
            required:
              - uploadKey
              - urls
            properties:
              reason:
                type: string
                description: Describes an error that was encountered. Returned only if the signed URL request for that object failed.
              status:
                type: string
                description: Returned only if the signed URL request for that object failed.
              uploadExpiration:
                type: string
                description: 'The deadline to call [Complete Batch Upload to S3 Signed URLs](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-batchcompleteupload-POST/) for the object. If not completed by this time, all uploaded data for this session will be discarded.'
              uploadKey:
                type: string
                description: |
                  An ID that uniquely identifies the upload session. It allows OSS to differentiate between fresh upload attempts from attempts to resume uploading data for an active upload session, in case of network interruptions. You must provide this value when:

                  - Re-requesting chunk URLs for an active upload session.
                  - When calling the [Complete Batch Upload to S3 Signed URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-batchcompleteupload-POST/) operation to end an active upload session.
              urlExpiration:
                type: string
                description: 'The date and time, in the ISO 8601 format, indicating when the signed URLs will expire.'
              urls:
                type: array
                description: 'An array of signed URLs. For a single-part upload, this will only include a single URL. For a multipart upload, there will be one for each chunk of a multipart upload; the index of the URL in the array corresponds to the part number of the chunk.'
                items:
                  type: string
          description: 'A map of the returned results; each key in the map corresponds to an object key in the batch, and the value includes the results for that object.'
      required:
        - results
    BatchSignedS3UploadPayload:
      required:
        - requests
      type: object
      description: The request payload for a Batch Generate Signed S3 Upload URLs operation.
      properties:
        requests:
          type: array
          description: An array where each element is an object containing information needed to generate a signed S3 upload URL.
          items:
            type: object
            required:
              - objectKey
            properties:
              objectKey:
                type: string
                description: A URL-encoded human friendly name of the object to upload.
              firstPart:
                type: integer
                description: The index of first chunk to be uploaded.
              parts:
                type: integer
                description: 'The number of parts you intend to chunk the object for uploading. OSS will return that many signed URLs, one URL for each chunk. If you do not specify a value you''ll get only one URL to upload the entire object.'
              uploadKey:
                type: string
                description: 'The ``uploadKey`` of a previously-initiated upload, in order to request more chunk upload URLs for the same upload. If you do not specify a value, OSS will initiate a new upload entirely.'
    BatchCompleteUploadPayload:
      required:
        - requests
      type: object
      description: The request payload for the Complete Batch Upload to S3 Signed URLs operation.
      properties:
        requests:
          type: array
          description: 'An array of objects, each of which represents an upload to complete.'
          items:
            type: object
            required:
              - objectKey
              - uploadKey
            properties:
              objectKey:
                type: string
                description: The URL-encoded human friendly name of the object for which to complete an upload.
              uploadKey:
                type: string
                description: The ID uniquely identifying the upload session that was returned when you obtained the signed upload URL.
              size:
                type: integer
                description: 'The expected size of the object, in bytes. If provided, OSS compares this value against the actual size of the object in S3.'
                format: int64
              eTags:
                type: array
                description: 'An array of eTags. S3 returns an eTag to each upload request, be it for a chunk or an entire file. For a single-part upload, this array contains the expected eTag of the entire object. For a multipart upload, this array contains the expected eTag of each part of the upload; the index of an eTag in the array corresponds to its part number in the upload. If provided, OSS validates these eTags against the content in S3.'
                items:
                  type: string
              x-ads-meta-Content-Type:
                type: string
                description: The Content-Type value for the uploaded object to record within OSS.
              x-ads-meta-Content-Disposition:
                type: string
                description: The Content-Disposition value for the uploaded object to record within OSS.
              x-ads-meta-Content-Encoding:
                type: string
                description: The Content-Encoding value for the uploaded object to record within OSS.
              x-ads-meta-Cache-Control:
                type: string
                description: The Cache-Control value for the uploaded object to record within OSS.
              x-ads-user-defined-metadata:
                type: string
                description: |
                  Custom metadata to be stored with the object, which can be retrieved later on download or when retrieving object details. Must be a JSON object that is less than 100 bytes.
    BatchCompleteUpload:
      required:
        - results
      type: object
      description: The response to a Complete Batch Upload to S3 Signed URLs operation.
      properties:
        results:
          type: object
          description: 'A map of the returned results; each key in the map corresponds to an object key in the batch, and the value includes the results for that object.'
          additionalProperties:
            $ref: '#/components/schemas/BatchCompletedResults'
    BatchCompletedResults:
      type: object
      description: The results returned by the Complete Batch Upload to S3 Signed URLs operation.
      properties:
        uploadKey:
          type: string
          description: 'The ID uniquely identifying the upload session that was returned when you obtained the signed upload URL. Returned when completion fails.'
        status:
          type: string
          description: |
            If this attribute is not returned, completion has succeeded. If the value of this attribute is "error", completion failed.'
        bucketKey:
          type: string
          description: The bucket key of the bucket the object was uploaded to.
        objectKey:
          type: string
          description: The URL-encoded human friendly name of the object.
        objectId:
          type: string
          description: An identifier (URN) that uniquely and persistently identifies the object.
        location:
          type: string
          description: 'A URL that points to the actual location of the object. Returned when completion succeeds.'
        size:
          $ref: '#/components/schemas/CompletedObjectSize'
        contentType:
          type: string
          description: 'The format of the data stored within the object, expressed as a MIME type. This attribute is returned only if it was specified when the object was uploaded.'
        contentDisposition:
          type: string
          description: The Content-Disposition value for the uploaded object as recorded within OSS. This attribute is returned only if it was specified when the object was uploaded.
        contentEncoding:
          type: string
          description: The Content-Encoding value for the uploaded object as recorded within OSS. This attribute is returned only if it was specified when the object was uploaded.
        cacheControl:
          type: string
          description: The Cache-Control value for the uploaded object as recorded within OSS. This attribute is returned only if it was specified when the object was uploaded.
        parts:
          type: array
          description: 'An array containing the status of each part, indicating any issues with eTag or size mismatch issues.'
          items:
            $ref: '#/components/schemas/CompletedPart'
        reason:
          type: string
          description: 'The reason for the failure, if the status is ``error``.'
    SignedS3Upload:
      required:
        - uploadKey
        - urls
      type: object
      description: The response payload to a Generate Signed S3 Upload URL operation.
      properties:
        uploadKey:
          type: string
          description: |
            An ID that uniquely identifies the upload session. It allows OSS to differentiate between fresh upload attempts from attempts to resume uploading data for an active upload session, in case of network interruptions. You must provide this value when:

            - Re-requesting chunk URLs for an active upload session. 
            - When calling the [Complete Upload to S3 Signed URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signeds3upload-POST/) operation to end an active upload session.
        urls:
          type: array
          description: 'An array of signed URLs. For a single-part upload, this will contain only one URL. For a multipart upload, there will be one for each chunk of a multipart upload; the index of the URL in the array corresponds to the part number of the chunk.'
          items:
            type: string
        urlExpiration:
          type: string
          description: 'The date and time, in the ISO 8601 format, indicating when the signed URLs will expire.'
        uploadExpiration:
          type: string
          description: 'The deadline to call [Complete Upload to S3 Signed URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signeds3upload-POST/) for the object. If not completed by this time, all uploaded data for this session will be discarded.'
    CompleteS3UploadPayload:
      required:
        - uploadKey
      type: object
      description: The request payload for a Complete Upload to S3 Signed URL operation.
      properties:
        uploadKey:
          type: string
          description: 'The ID uniquely identifying the upload session that was returned when you called [Get S3 Signed Upload URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signeds3upload-GET/).'
        size:
          type: integer
          description: 'The expected size of the object, in bytes. If specified, OSS compares this value against the actual size of the object in S3.'
          format: int64
        eTags:
          type: array
          description: 'An array of eTags. S3 returns an eTag to each upload request, be it for a chunk or an entire file. For a single-part upload, this array contains the expected eTag of the entire object. For a multipart upload, this array contains the expected eTag of each part of the upload; the index of an eTag in the array corresponds to its part number in the upload. If specified, OSS validates these eTags against the content in S3.'
          items:
            type: string
    CompletedObjectSize:
      description: |
        The object size, in bytes. Returned as an integer when validation succeeds or when only ``eTags`` was specified in the request. Returned as the requested and detected object sizes when ``size`` was specified in the request and size validation fails.
      oneOf:
        - type: integer
          format: int64
          description: 'The total amount of storage space occupied by the object, in bytes. Returned when validation succeeds or when only ``eTags`` was specified in the request.'
        - type: object
          description: Contains the object size specified in the request compared with the size detected in S3. Returned when validation fails.
          properties:
            expected:
              type: integer
              format: int64
              description: 'The object size specified in the request, in bytes.'
            detected:
              type: integer
              format: int64
              description: 'The object size detected in S3, in bytes.'
    CompletedPart:
      type: object
      description: Represents the validation status of an uploaded part.
      properties:
        part:
          type: integer
          description: The part number in the multipart upload.
        status:
          $ref: '#/components/schemas/Status'
        size:
          type: integer
          format: int64
          description: 'The size of the part detected in S3, in bytes.'
        eTag:
          type: string
          description: The eTag of the part detected in S3.
    CompleteS3Upload:
      description: |
        The response payload for a Complete Upload to S3 Signed URL operation.

        **Note:** The documentation labels this ``oneOf``, but its two variants overlap — a plain
        success payload validates against both — so ``anyOf`` is used here.
      anyOf:
        - $ref: '#/components/schemas/CompleteS3UploadSuccess'
        - $ref: '#/components/schemas/CompleteS3UploadValidation'
    CompleteS3UploadSuccess:
      type: object
      description: 'The response body returned when the request does not include ``size`` or ``eTags``.'
      properties:
        bucketKey:
          type: string
          description: The bucket key of the bucket the object was uploaded to.
        objectId:
          type: string
          description: An identifier (URN) that uniquely and persistently identifies the object.
        objectKey:
          type: string
          description: A URL-encoded human-friendly name that identifies the object.
        size:
          type: integer
          format: int64
          description: 'The total amount of storage space occupied by the object, in bytes.'
        contentType:
          type: string
          description: 'The format of the data stored within the object, expressed as a MIME type.'
        location:
          type: string
          description: A URL that points to the actual location of the object.
    CompleteS3UploadValidation:
      type: object
      description: 'The response body returned when the request includes ``size`` and/or ``eTags`` to validate the uploaded object.'
      properties:
        uploadKey:
          type: string
          description: The ID uniquely identifying the upload session that was returned when you called Get S3 Signed Upload URL.
        status:
          type: string
          description: The overall validation outcome for the upload. If this attribute is not returned, validation succeeded.
        reason:
          type: string
          description: 'The reason for the failure, when validation fails.'
        bucketKey:
          type: string
          description: The bucket key of the bucket the object was uploaded to. Returned when validation succeeds.
        objectId:
          type: string
          description: An identifier (URN) that uniquely and persistently identifies the object. Returned when validation succeeds.
        objectKey:
          type: string
          description: A URL-encoded human-friendly name that identifies the object. Returned when validation succeeds.
        contentType:
          type: string
          description: 'The format of the data stored within the object, expressed as a MIME type. Returned when validation succeeds.'
        location:
          type: string
          description: A URL that points to the actual location of the object. Returned when validation succeeds.
        size:
          $ref: '#/components/schemas/CompletedObjectSize'
        parts:
          type: array
          description: An array of objects where each object represents the validation status of an uploaded part.
          items:
            $ref: '#/components/schemas/CompletedPart'
    PolicyKey:
      title: PolicyKey
      x-stoplight:
        id: 288f4f38318eb
      type: string
      default: transient
      description: |-
        Specifies the retention policy for the objects stored in the bucket. Possible values are: 
                    
        - ``transient`` - Objects are retained for 24 hours.
        - ``temporary`` - Objects are retained for 30 days.
        - ``persistent`` - Objects are retained until they are deleted.
      enum:
        - transient
        - temporary
        - persistent
    Region:
      title: Region
      x-stoplight:
        id: yjjcwdkrxykkc
      type: string
      enum:
        - US
        - EMEA
        - AUS
        - CAN
        - DEU
        - IND
        - JPN
        - GBR
      description: |-
        Specifies where the bucket containing the object is stored. Possible values are:

        - ``US`` : (Default) Data center for the US region.
        - ``EMEA`` : Data center for the European Union, Middle East, and Africa.
        - ``AUS`` : Data center for Australia.
        - ``CAN`` : Data center for the Canada region.
        - ``DEU`` : Data center for the Germany region.
        - ``IND`` : Data center for the India region.
        - ``JPN`` : Data center for the Japan region.
        - ``GBR`` : Data center for the United Kingdom region.
    Access:
      title: Access
      x-stoplight:
        id: e4sb0u69u0uo5
      type: string
      enum:
        - Read
        - Write
        - ReadWrite
      description: |
        Possible values:

        - ``Read``
        - ``Write``
        - ``ReadWrite``
    With:
      title: With
      description: |
        Possible values:

        - ``createdDate``
        - ``lastAccessedDate``
        - ``lastModifiedDate``
        - ``userDefinedMetadata``
      type: string
      enum:
        - createdDate
        - lastAccessedDate
        - lastModifiedDate
        - userDefinedMetadata
    Status:
      title: Status
      x-stoplight:
        id: cuyfz4812l1b2
      type: string
      description: |
        Indicates whether this particular part uploaded to S3 is valid. Possible values are:

        - ``Pending`` - No such part was uploaded to S3 for this index. 
        - ``Unexpected`` - The eTag of the part in S3 does not match the one provided in the request. 
        - ``TooSmall`` - A chunk uploaded to S3 is smaller than 5MB. Only the final chunk can be smaller than 5MB. 
        - ``Unexpected+TooSmall`` - The chunk is both too small and has an eTag mismatch. 
        - ``Ok`` - The chunk has no issues.'
      enum:
        - Pending
        - Unexpected
        - TooSmall
        - Unexpected+TooSmall
        - Ok
    DownloadStatus:
      title: DownloadStatus
      x-stoplight:
        id: bufzykd0rpk39
      type: string
      description: |
        Indicates the current state of the object requested for download. Possible values are:

        - ``complete`` - The object is ready to be downloaded.
        - ``chunked`` - The object was uploaded in chunks, but assembly of chunks into the final object is still pending. Returned when ``public-resource-fallback`` = ``false`` in the request.
        - ``fallback`` - The object was uploaded in chunks, but assembly of chunks into the final object is still pending. Will return an OSS Signed URL instead of a S3 signed URL because ``public-resource-fallback`` was set to ``true`` in the request.
        - ``skipped`` - The server has evaluated an ``If-None-Match`` or ``If-Modified-Since`` parameter in the request and determined that the cached version of the object is still up-to-date.
        - ``error`` - There was an error in the request. Review and verify the requested ``bucketKey``, ``content-type``, and ``content-disposition`` before you try again.
      enum:
        - complete
        - chunked
        - fallback
        - skipped
        - error
    PermissionAccess:
      title: PermissionAccess
      x-stoplight:
        id: 5rtb0xo1tipoq
      type: string
      description: |
        Specifies the level of permission the application has. Regardless of the permission level, an application can only read, modify, or delete objects it has created. Possible values are:

        - ``read`` - Permission to download objects from the bucket.
        - ``write`` - Permission to upload and replace objects in the bucket.
        - ``full`` - Permission to download, upload, replace, and delete objects in the bucket.
      enum:
        - read
        - write
        - full
    AllowAccess:
      title: AllowAccess
      x-stoplight:
        id: ljxm7uf2g5rib
      type: string
      enum:
        - read
        - write
        - full
      description: |-
        Specifies the level of permission the specified application will have. Required when ``allow`` is specified. Regardless of the permission level, an application can only read, modify, or delete objects it has created. Possible values are:

        - ``read`` - Permission to download objects from the bucket.
        - ``write`` - Permission to upload and replace objects in the bucket.
        - ``full`` - Permission to download, upload, replace, and delete objects in the bucket.
  responses:
    BAD_REQUEST:
      description: OSS was unable to process the request. The syntax of the request is malformed or the request is missing a required header. Do not repeat the request without fixing the issue. The response body may indicate what is wrong with the request
      content: {}
    FORBIDDEN:
      description: The request was successfully validated but lacking the required permissions. Verify your credentials and permissions before you send this request again.
      content: {}
    INTERNAL_SERVER_ERROR:
      description: 'An unexpected error occurred on the server, preventing it from completing your request. Please try again later. If the issue persists, contact the support team for assistance.'
      content: {}
    NOT_FOUND:
      description: The requested resource could not be found. Verify the IDs of the resources you requested before you send this request again.
      content: {}
    UNAUTHORIZED:
      description: The supplied authorization header was not valid or the supplied token scope was not acceptable. Verify authentication and try again.
      content: {}
    RATE_LIMIT_EXCEEDED:
      description: Rate limit exceeded. Please wait for a few moments before retrying. Increase the wait time with each attempt before trying again.
  parameters:
    bucketKey:
      name: bucketKey
      in: path
      description: 'The unique ID of the bucket that contains the objects you are operating on. ``bucketKey`` must be URL-encoded.'
      required: true
      schema:
        pattern: '^[-_.a-z0-9]{3,128}$'
        type: string
    objectKey:
      name: objectKey
      in: path
      description: The URL-encoded human friendly name of the object.
      required: true
      schema:
        type: string
    x-ads-region:
      name: x-ads-region
      in: header
      description: |-
        Specifies where the bucket containing the object is stored. Possible values are:

        - ``US`` : (Default) Data center for the US region.
        - ``EMEA`` : Data center for the European Union, Middle East, and Africa.
        - ``AUS`` : Data center for Australia.
        - ``CAN`` : Data center for the Canada region.
        - ``DEU`` : Data center for the Germany region.
        - ``IND`` : Data center for the India region.
        - ``JPN`` : Data center for the Japan region.
        - ``GBR`` : Data center for the United Kingdom region.
      schema:
        $ref: '#/components/schemas/Region'
    region_header:
      name: x-ads-region
      in: header
      description: |-
        Specifies where the bucket must be stored. Possible values are:

        - ``US`` : (Default) Data center for the US region.
        - ``EMEA`` : Data center for the European Union, Middle East, and Africa.
        - ``AUS`` : Data center for Australia.
        - ``CAN`` : Data center for the Canada region.
        - ``DEU`` : Data center for the Germany region.
        - ``IND`` : Data center for the India region.
        - ``JPN`` : Data center for the Japan region.
        - ``GBR`` : Data center for the United Kingdom region.
      schema:
        $ref: '#/components/schemas/Region'
    region:
      name: region
      in: query
      description: |-
        Specifies where the bucket containing the object is stored. Possible values are:

        - ``US`` : (Default) Data center for the US region.
        - ``EMEA`` : Data center for the European Union, Middle East, and Africa.
        - ``AUS`` : Data center for Australia.
        - ``CAN`` : Data center for the Canada region.
        - ``DEU`` : Data center for the Germany region.
        - ``IND`` : Data center for the India region.
        - ``JPN`` : Data center for the Japan region.
        - ``GBR`` : Data center for the United Kingdom region.
      schema:
        $ref: '#/components/schemas/Region'
    limit:
      name: limit
      in: query
      description: |
        The maximum number of items to return per page. This parameter controls pagination by limiting the size of each response. Acceptable values: 1-100. Default value: 10.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    startAt:
      name: startAt
      in: query
      description: |
        The ID of the last item from the previous result set. Use this parameter to retrieve the next page of results by starting from the item immediately following the specified ID.
      schema:
        type: string
    If-None-Match:
      name: If-None-Match
      in: header
      description: 'The last known ``sha1`` value of the object. OSS returns the requested data only if the ``If-None-Match`` header differs from the ``sha1`` value of the object on OSS, which indicates that the object on OSS is newer. If not, it returns a 304 "Not Modified" HTTP status.'
      schema:
        type: string
    If-Modified-Since:
      name: If-Modified-Since
      in: header
      description: |
        A timestamp in the HTTP date format (Mon, DD Month YYYY HH:MM:SS GMT). The requested data is returned only if the object has been modified since the specified timestamp. If not, a 304 (Not Modified) HTTP status is returned.
      schema:
        type: string
        format: date
    access:
      name: access
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Access'
    with:
      name: with
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/With'
