  '/oss/v2/buckets/{bucketKey}/objects/{objectKey}/signeds3upload':
    parameters:
      - $ref: '#/components/parameters/bucketKey'
      - $ref: '#/components/parameters/objectKey'
    get:
      tags:
        - Upload Workflow
      summary: Generate Signed S3 Upload URL
      description: |
        Generates a signed URL to upload an object directly to S3, bypassing OSS servers. This signed URL expires in 2 minutes by default, but you can change this duration if needed. You must start the upload before the signed URL expires. The upload itself can take longer.

        Additionally:

        - Chunked uploads: You can request an array of signed URLs to upload an object in chunks for better performance.
        - Upload completion: After uploading all chunks, you must call the [Complete Upload to S3 Signed URL](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-:objectKey-signeds3upload-POST/) operation to assemble the chunks and reconstitute the object on OSS. This is required even when using a single signed URL.
        - Failed uploads: If an upload fails after the signed URL expires, you can call this operation again using the same ``uploadKey`` that was originally returned.

        OSS offers two types of signed URLs:

        - S3 Signed URLs (the type generated by this operation): Enable direct S3 upload/download but are restricted to bucket owners only.
        - OSS Signed URLs: Also support upload/download operations and can be configured for access by other applications, making them ideal for sharing objects across different systems.

        **Important:** Only applications that own the bucket can call this operation.
      operationId: signedS3Upload
      parameters:
        - name: parts
          in: query
          description: |
            The number of parts you intend to chunk the object for uploading. OSS will return that many signed URLs, one URL for each chunk. If you do not specify a value you'll get only one URL to upload the entire object.             
          schema:
            type: integer
        - name: firstPart
          in: query
          description: The index of the first chunk to be uploaded.
          schema:
            type: integer
        - name: uploadKey
          in: query
          description: 'The ``uploadKey`` of a previously-initiated upload, in order to request more chunk upload URLs for the same upload. If you do not specify a value, OSS will initiate a new upload entirely.'
          schema:
            type: string
        - name: minutesExpiration
          in: query
          description: |
            The time window (in minutes) the signed URL will remain usable. Acceptable values = 1-60 minutes. Default = 2 minutes.

            **Tip:** Use the smallest possible time window to minimize exposure of the signed URL.
          schema:
            type: integer
            minimum: 1
            maximum: 60
        - name: useAcceleration
          in: query
          description: |
            Determines whether the generated signed upload URL should use S3 Transfer Acceleration. Possible values:

            - ``true`` : (Default) Generates a faster S3 signed URL using Transfer Acceleration.
            - ``false`` : Generates a standard S3 signed URL.
          schema:
            type: boolean
      responses:
        '200':
          description: The signed S3 upload URLs were successfully generated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SignedS3Upload'
            application/json:
              examples:
                multipart:
                  summary: Requests an array of signed URLs with which to upload an object in multiple parts. (200).
                  value:
                    uploadKey: '{UPLOAD_KEY}'
                    uploadExpiration: '2022-01-25T00:00:00Z'
                    urlExpiration: '2022-01-23T21:48:42Z'
