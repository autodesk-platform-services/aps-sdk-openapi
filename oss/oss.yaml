  '/oss/v2/buckets/{bucketKey}/objects/{objectKey}/signeds3download':
    get:
      tags:
        - Download Workflow
      summary: Generate Signed S3 Download URL
      description: |
        Generates a signed URL to download an object directly from S3, bypassing OSS servers. This signed URL expires in 2 minutes by default, but you can change this duration if needed. You must start the download before the signed URL expires. The download itself can take longer. If the download fails after the validity period of the signed URL has elapsed, you can call this operation again to obtain a fresh signed URL.

        Additionally:

        - Range headers: You can use range headers with the signed download URL to download the object in chunks, enabling parallel downloads for better performance.
        - Multi-part objects: If the object was uploaded in chunks and is still assembling, you'll receive multiple S3 URLs (one per chunk). To receive a single URL instead, set the ``public-resource-fallback`` query parameter to ``true``, which makes OSS return a single signed OSS URL while assembly is in progress.

        OSS offers two types of signed URLs:

        - S3 Signed URLs (the type generated by this operation): Enable direct S3 upload/download but are restricted to bucket owners only.
        - OSS Signed URLs: Also support upload/download operations and can be configured for access by other applications, making them ideal for sharing objects across different systems.

        **Important:** Only applications with read access to the object can call this operation.
      operationId: signedS3Download
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - $ref: '#/components/parameters/objectKey'
        - name: x-ads-acm-scopes
          in: header
          description: Optional OSS-compliant scope reference to increase bucket search performance.
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: 'The last known ``sha1`` value of the object. OSS returns the signed URL only if the ``If-None-Match`` header differs from the ``sha1`` value of the object on S3. If not, it returns a 304 "Not Modified" HTTP status.'
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          description: 'A timestamp in the HTTP date format (Mon, DD Month YYYY HH:MM:SS GMT). The signed URL is returned only if the object has been modified since the specified timestamp. If not, a 304 (Not Modified) HTTP status is returned.'
          schema:
            type: string
            format: date
        - name: response-content-type
          in: query
          description: 'The value of the Content-Type header you want to receive when you download the object using the signed URL. If you do not specify a value, the Content-Type header defaults to the value stored with OSS.'
          schema:
            type: string
        - name: response-content-disposition
          in: query
          description: 'The value of the Content-Disposition header you want to receive when you download the object using the signed URL. If you do not specify a value, the Content-Disposition header defaults to the value stored with OSS.'
          schema:
            type: string
        - name: response-cache-control
          in: query
          description: 'The value of the Cache-Control header you want to receive when you download the object using the signed URL. If you do not specify a value, the Cache-Control header defaults to the value stored with OSS.'
          schema:
            type: string
        - name: public-resource-fallback
          in: query
          description: |
            Determines how OSS returns the signed URLs when chunk assembly is not yet complete. Possible values:

            - ``true`` : Returns a single signed OSS URL.
            - ``false`` : (Default) Returns multiple signed S3 URLs, where each URL points to a chunk.
          schema:
            type: boolean
        - name: minutesExpiration
          in: query
          description: |
            The time window (in minutes) the signed URL will remain usable. Acceptable values = 1-60 minutes. Default = 2 minutes.

            **Tip:** Use the smallest possible time window to minimize exposure of the signed URL.
          schema:
            type: integer
            minimum: 1
            maximum: 60
        - name: useCdn
          in: query
          description: |
            Determines whether the generated signed URL should use a CloudFront edge location. Possible values:

            - ``true`` : Returns a URL that points to a CloudFront edge location.
            - ``false`` : (Default) Returns a URL that points directly to the S3 object.
          schema:
            type: boolean
      responses:
        '200':
          description: The signed S3 download URL was successfully generated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SignedS3Download'
            application/json:
              examples:
                complete:
                  summary: Demonstrates the obtaining of an S3 signed URL for an object (raw uploads or merged resumable uploads) (200).
                  value:
                    status: complete
                    url: https://oss-bucket-name.s3.amazonaws.com/4F/2D/df/a9f898eda7edee1ab9827cfeb57f2ec647/apptestbucket?response-content-disposition=attachment%3B%20filename%3D%22objectKeyFoo%22&response-content-type=application%2Foctet-stream&X-Amz-Security-Token=AWS_TOKEN&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20210120T152914Z&X-Amz-SignedHeaders=host&X-Amz-Expires=120&X-Amz-Credential=[AMZ CREDENTIAL]&X-Amz-Signature=6c1abf52e7849asignature
                    params:
                      content-type: application/octet-stream
                      content-disposition: attachment; filename="objectKeyFoo"
                    size: 221983
                    sha1: 4F2Ddfa9f898eda7edee1ab9827cfeb57f2ec647
                fallback:
                  summary: Demonstrates the obtaining an OSS signed URL for an unmerged object because public-resource-fallback equals to true (200).
                  value:
                    status: fallback
                    url: http://developer.api.autodesk.com/oss/v2/signedresources/6969f2ed-2931-498f-bad8-b9d300ad1c7e?region=US
                    params:
                      content-type: application/json
                      content-disposition: attachment; filename="unmerged.json"
                    size: 19715187
                chunked:
                  summary: Demonstrates the obtaining of multiple S3 signed URLs for an unmerged object, one per chunk (200).
                  value:
                    status: chunked
                    urls:
                      0-10747471: https://oss-bucket.s3.amazonaws.com/ead4b508f5a502b9251d16b640128ad83af7e4ba/bucket/apptestbucket/chunk-uuid/uuid-fcdf6275-8789-472f-b811-5472c9262ffc?response-content-disposition=attachment%3B%20filename%3D%22unmerged.json%22&response-content-type=application%2Fjson&X-Amz-Security-Token=AWS_TOKEN&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20210120T152914Z&X-Amz-SignedHeaders=host&X-Amz-Expires=120&X-Amz-Credential=[AMZ CREDENTIAL]&X-Amz-Signature=6c1abf52e7849asignature
                      10747472-19715186: https://oss-bucket.s3.amazonaws.com/ead4b508f5a502b9251d16b640128ad83af7e4ba/bucket/apptestbucket/chunk-uuid/uuid-cc685997-7afa-4dd3-ada3-71390a973bc5?response-content-disposition=attachment%3B%20filename%3D%22unmerged.json%22&response-content-type=application%2Fjson&X-Amz-Security-Token=AWS_TOKEN&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20210120T152914Z&X-Amz-SignedHeaders=host&X-Amz-Expires=120&X-Amz-Credential=[AMZ CREDENTIAL]&X-Amz-Signature=6c1abf52e7849asignature
                    params:
                      content-type: application/json
                      content-disposition: attachment; filename="unmerged.json"
                    size: 19715187
                with-expiration:
                  summary: Demonstrates the obtaining of an S3 signed URL for an object using the minutesExpiration parameter (200).
                  value:
                    status: complete
                    url: https://oss-bucket-name.s3.amazonaws.com/4F/2D/df/a9f898eda7edee1ab9827cfeb57f2ec647/apptestbucket?response-content-disposition=attachment%3B%20filename%3D%22objectKeyFoo%22&response-content-type=application%2Foctet-stream&X-Amz-Security-Token=AWS_TOKEN&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20210120T152914Z&X-Amz-SignedHeaders=host&X-Amz-Expires=1800&X-Amz-Credential=[AMZ CREDENTIAL]&X-Amz-Signature=6c1abf52e7849asignature
                    params:
                      content-type: application/octet-stream
                      content-disposition: attachment; filename="objectKeyFoo"
                    size: 221983
                    sha1: 4F2Ddfa9f898eda7edee1ab9827cfeb57f2ec647
              schema:
                $ref: '#/components/schemas/SignedS3Download'
        '304':
          description: 'The object has not been modified. OSS returns this response when the ``If-None-Match`` header matches the ``sha1`` value of the object on S3, or when the object has not been modified since the ``If-Modified-Since`` date.'
          content: {}
        '400':
          description: The request could not be processed due to missing or malformed parameters.
          content: {}
        '401':
          description: Invalid authorization header.
          content: {}
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          description: The specified object or bucket does not exist.
          content: {}
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
      security:
        - 2-legged:
            - 'data:read'
      x-codeSamples:
        - lang: cURL
          source: 'curl -v "https://developer.api.autodesk.com/oss/v2/buckets/apptestbucket/objects/objectKeyFoo/signeds3download" -X GET -H "Authorization: Bearer eYeL5gYxAT2j3u9TEerxoJoToNbi"'
  '/oss/v2/buckets/{bucketKey}/objects/batchsigneds3upload':
    post:
      tags:
        - Batch Upload Workflow
      summary: Batch Generate Signed S3 Upload URLs
      description: |
        Generates signed URLs to upload a set of objects directly to S3. These signed URLs expire in 2 minutes by default, but you can change this duration if needed. You must start uploading the objects before the signed URLs expire. The upload itself can take longer.

        Additionally:

        - Chunked uploads: You can request an array of signed URLs for each object to upload objects in chunks for better performance.
        - Upload completion: After uploading all chunks, you must call the [Complete Batch Upload to S3 Signed URLs](/en/docs/data/v2/reference/http/oss/buckets-:bucketKey-objects-batchcompleteupload-POST/) operation to assemble the chunks and reconstitute the object on OSS. This is required even for single signed URL uploads.
        - Failed uploads: If an upload fails after the signed URL expires, you can call this operation again using the same ``uploadKey`` that was originally returned.

        **Important:** Only the application that owns the bucket can call this operation. All other applications will receive a "403 Forbidden" error.
      operationId: batchSignedS3Upload
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - name: useAcceleration
          in: query
          description: |
            Determines whether the generated signed upload URL should use S3 Transfer Acceleration. Possible values:

            - ``true`` : (Default) Generates a faster S3 signed URL using Transfer Acceleration.
            - ``false`` : Generates a standard S3 signed URL.
          schema:
            type: boolean
        - name: minutesExpiration
          in: query
          description: |
            The time window (in minutes) the signed URL will remain usable. Acceptable values = 1-60 minutes. Default = 2 minutes.

            **Tip:** Use the smallest possible time window to minimize exposure of the signed URL.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      requestBody:
        description: An array of objects representing each request for a signed upload URL.
        content:
          application/json:
            examples:
              basic:
                summary: Basic Request for 3 objects (200).
                value:
                  requests:
                  - objectKey: testbatch01.txt
                  - objectKey: testbatch02.txt
                  - objectKey: testbatch03.txt
            schema:
              $ref: '#/components/schemas/BatchSignedS3UploadPayload'
      responses:
        '200':
          description: The request was successfully processed. The response body will contain objects that indicate the outcome for each object signed URLs were requested for. Objects corresponding to successful request will contain signed URLs. Objects corresponding to failed requests will contain details of the failure.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/BatchSignedS3Upload'
            application/json:
              examples:
