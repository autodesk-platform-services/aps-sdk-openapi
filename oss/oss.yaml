  '/oss/v2/buckets/{bucketKey}/objects/batchsigneds3download':
    post:
      tags:
        - Batch Download Workflow
      summary: Generate Signed S3 Download URLs (Batch)
      description: |
        Generates signed URLs to download a set of objects directly from S3. These signed URLs expire in 2 minutes by default, but you can change this duration if needed. You must start downloading the objects before the signed URLs expire. The download itself can take longer.

        Additionally:

        - Failed downloads: If a download fails after the signed URL expires, you can call this operation again to obtain fresh signed URLs.

        **Important:** Only the application that owns the bucket can call this operation. All other applications will receive a "403 Forbidden" error.
      operationId: batchSignedS3Download
      parameters:
        - $ref: '#/components/parameters/bucketKey'
        - name: public-resource-fallback
          in: query
          description: |
            Determines how OSS returns the signed URLs when chunk assembly is not yet complete. Possible values:

            - ``true`` : Returns a single signed OSS URL.
            - ``false`` : (Default) Returns multiple signed S3 URLs, where each URL points to a chunk.
          schema:
            type: boolean
        - name: minutesExpiration
          in: query
          description: |
            The time window (in minutes) the signed URL will remain usable. Acceptable values = 1-60 minutes. Default = 2 minutes.

            **Tip:** Use the smallest possible time window to minimize exposure of the signed URL.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      requestBody:
        description: An array of objects representing each request for a signed download URL.
        content:
          application/json:
            examples:
              no-fallback:
                summary: Demonstrates the obtaining of a mix of successful and unsuccessful signed URLs, without falling back to OSS signed URLs (200).
